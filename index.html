/* ══════════════════════════════════════════════════════════════════════
   4. DATA LAYER — parsing
   ══════════════════════════════════════════════════════════════════════ */

const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/* Longest aliases first so "annualpremium" wins before bare "premium". */
const ALIASES = {
  name:          ["name","clientname","insuredname","customername","client","insured","customer"],
  price:         ["annualpremium","totalpremium","premiumamount","premium","price","amount","cost"],
  boundDate:     ["bounddate","datebound","binddate","dateclosed","closeddate","bound","sold"],
  effectiveDate: ["effectivedate","effdate","effective"],
  leadDate:      ["leaddate","datelead"],
  type:          ["typeofinsurance","policytype","insurancetype","linetype","coverage","product","type","line"],
  platform:      ["salesplatform","platform","carrier","company","provider"],
  policyNumber:  ["policynumber","policyno","polnum","policy"],
  leadSource:    ["leadsource","leadsrc","source"],
  status:        ["status"],
  review:        ["reviews","review","testimonial","feedback","rating"],
};

/* Maps each field to a real header from this sheet. Exact match first, then
   substring, so "Bound Date (Eff)" and "12 Month Premium" still land. */
function buildFieldMap(headers) {
  const map = {}, used = new Set();
  const pick = (field, test) => {
    if (map[field]) return;
    for (const alias of ALIASES[field]) {
      const hit = headers.find(h => !used.has(h) && test(norm(h), alias));
      if (hit) { map[field] = hit; used.add(hit); return; }
    }
  };
  Object.keys(ALIASES).forEach(f => pick(f, (h, a) => h === a));
  Object.keys(ALIASES).forEach(f => pick(f, (h, a) => a.length >= 4 && h.includes(a)));
  return map;
}

function toNumber(raw) {
  if (raw == null) return 0;
  let s = String(raw).trim();
  if (!s) return 0;
  const neg = /^\(.*\)$/.test(s);
  s = s.replace(/[()$,\s]/g, "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}

function toDate(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  // Sheets serial number
  if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date((Number(s) - 25569) * 86400000); return isNaN(d) ? null : d; }
  // ISO date — build locally so it doesn't drift a day backwards in Pacific time
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  // M/D/YYYY
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

const fmtDate = d => d ? (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear() : "";

function categorize(type) {
  const t = String(type || "").toLowerCase();
  if (/life|annuity|term|final expense/.test(t)) return "life";
  if (/commercial|business|workers|bop|liability|restaurant|habitational|contractor|garage|fleet/.test(t)) return "commercial";
  return "personal";
}

function parseSale(row, map) {
  const get = f => map[f] ? row[map[f]] : null;
  const bound = toDate(get("boundDate"));
  return {
    name: String(get("name") || "").trim() || "Unknown",
    status: String(get("status") || "Bound").trim(),
    price: toNumber(get("price")),
    boundDate: fmtDate(bound),
    boundOn: bound,
    effectiveDate: String(get("effectiveDate") || "").trim(),
    type: String(get("type") || "Other").trim() || "Other",
    platform: String(get("platform") || "Unknown").trim() || "Unknown",
    policyNumber: String(get("policyNumber") || "").trim(),
    leadSource: String(get("leadSource") || "").trim(),
    review: String(get("review") || "").trim(),
  };
}

/* ══════════════════════════════════════════════════════════════════════
   5. DATA LAYER — fetching
   ══════════════════════════════════════════════════════════════════════ */

const csvByGid  = (id, gid)  => `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
const csvByName = (id, name) => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
const csvFirst  = id         => `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`;

async function fetchProducerSales(producer, periods, log) {
  const id = producer.sheetId;
  if (!id) { log(`${producer.name}: no sheet ID set`, "warn"); return []; }

  const seen = new Set(), out = [];
  const note = (label, msg, kind) => log(`${producer.name} · ${label} — ${msg}`, kind);

  const readCsv = text => {
    if (!text || text.length < 20) return { rows: [], why: "empty response" };
    const head = text.trimStart().slice(0, 400).toLowerCase();
    if (head.startsWith("<")) {
      return { rows: [], why: /signin|accounts\.google|sign in/.test(head)
        ? "sign-in page returned — this sheet is not shared with Anyone-with-link"
        : "HTML returned instead of CSV — tab missing, or sheet not shared" };
    }
    let parsed;
    try { parsed = Papa.parse(text, { header:true, skipEmptyLines:true, transformHeader: h => String(h || "").trim() }); }
    catch (e) { return { rows: [], why: "CSV parse failed: " + e.message }; }

    const headers = (parsed.meta && parsed.meta.fields) || [];
    const map = buildFieldMap(headers);
    if (!map.name || !map.price) {
      return { rows: [], why: `no ${!map.name ? "name" : "price"} column found. Headers: [${headers.join(" | ")}]` };
    }
    const rows = (parsed.data || []).map(r => parseSale(r, map))
      .filter(s => s.name && norm(s.name) !== "name" && s.price > 0);
    if (!rows.length && (parsed.data || []).length) {
      return { rows: [], why: `${parsed.data.length} rows read, none usable (need a name and a price above $0)` };
    }
    return { rows, why: "" };
  };

  const attempt = async (url, label) => {
    let res;
    try { res = await fetch(url, { redirect:"follow", cache:"no-store" }); }
    catch (e) { note(label, "blocked by CORS or network: " + e.message, "err"); return []; }
    if (!res.ok) { note(label, "HTTP " + res.status, "err"); return []; }
    let text = "";
    try { text = await res.text(); } catch (e) { note(label, "could not read body", "err"); return []; }
    const { rows, why } = readCsv(text);
    if (why) note(label, why, "warn");
    return rows;
  };

  const absorb = (rows, label) => {
    let added = 0;
    rows.forEach(r => {
      const key = `${norm(r.name)}|${r.boundDate}|${r.price}|${norm(r.policyNumber)}`;
      if (!seen.has(key)) { seen.add(key); out.push(r); added++; }
    });
    if (added) note(label, `+${added} policies`, "ok");
  };

  // Every place a folio tab might be hiding, in order of likelihood.
  const jobs = [
    { url: csvByGid(id, producer.gid || "0"), label: `gid ${producer.gid || 0}` },
    { url: csvFirst(id), label: "first tab" },
    ...periods.map(p => ({ url: csvByName(id, p.name), label: `tab "${p.name}"` })),
    ...["0","1","2","3","4","5"].filter(g => g !== String(producer.gid))
        .map(g => ({ url: csvByGid(id, g), label: `gid ${g}` })),
  ];

  for (let i = 0; i < jobs.length; i += 5) {
    const batch = jobs.slice(i, i + 5);
    const results = await Promise.all(batch.map(j => attempt(j.url, j.label)));
    results.forEach((rows, n) => absorb(rows, batch[n].label));
  }

  log(`${producer.name}: ${out.length} policies loaded`, out.length ? "ok" : "err");
  return out;
}

function currentPeriodIndex(periods) {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  for (let i = 0; i < periods.length; i++) {
    const s = new Date(periods[i].start + "T00:00:00"), e = new Date(periods[i].end + "T23:59:59");
    if (today >= s && today <= e) return i;
  }
  let last = 0;
  periods.forEach((p, i) => { if (today > new Date(p.end + "T23:59:59")) last = i; });
  return last;
}

function inPeriod(sales, period) {
  if (!period) return sales;
  const s = new Date(period.start + "T00:00:00"), e = new Date(period.end + "T23:59:59");
  return sales.filter(x => x.boundOn && x.boundOn >= s && x.boundOn <= e);
}

function splitLines(sales) {
  const out = { personal:{ count:0, premium:0 }, life:{ count:0, premium:0 }, commercial:{ count:0, premium:0 } };

}

  { name:"Commercial King",     desc:"5 commercial policies",      icon:"🏙️",  test:s => s.filter(x => categorize(x.type) === "commercial").length >= 5 },

const earnedBadges = sales => BADGES.map(b => ({ ...b, earned: b.test(sales) }));

const LEVELS = [0,1000,2500,4500,7000,10000,14000,19000,25000,35000];

function calcXP(sales) {
  let xp = 0;
  sales.forEach(s => {
    xp += 100;
    if (s.price >= 5000) xp += 200;
    if (s.price >= 10000) xp += 300;
    const c = categorize(s.type);
    if (c === "commercial") xp += 100;
    if (c === "life") xp += 120;
    if (s.review) xp += 75;
  });
  xp += earnedBadges(sales).filter(b => b.earned).length * 250;
  return xp;
}

function levelOf(xp) {
  let lvl = 1, floor = 0, next = LEVELS[1];
  for (let i = 0; i < LEVELS.length; i++) {
    if (xp >= LEVELS[i]) { lvl = i + 1; floor = LEVELS[i]; next = LEVELS[i + 1] ?? null; }
  }
  return { level: lvl, floor, next };
}

function bucketSales(sales, mode, periods) {
  const now = new Date(); now.setHours(23, 59, 59, 999);
  const make = (label, from, to) => {
    const rows = sales.filter(s => s.boundOn && s.boundOn >= from && s.boundOn <= to);
    const l = splitLines(rows);
    return { label, premium: rows.reduce((a, x) => a + x.price, 0), policies: rows.length,
             life: l.life.count, commercial: l.commercial.count, personal: l.personal.count };
  };
  if (mode === "daily") {
    return Array.from({ length: 28 }, (_, i) => {
      const d = new Date(now); d.setDate(d.getDate() - (27 - i));
      const from = new Date(d); from.setHours(0,0,0,0);
      const to = new Date(d); to.setHours(23,59,59,999);
      return make(`${d.getMonth()+1}/${d.getDate()}`, from, to);
    });
  }
  if (mode === "period") {
    return periods.map(p => make(p.name.split("-")[0],
      new Date(p.start + "T00:00:00"), new Date(p.end + "T23:59:59")))
      .filter(b => b.premium > 0 || b.policies > 0);
  }
  if (mode === "yearly") {
    const y = now.getFullYear();
    const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return names.map((nm, m) => make(nm, new Date(y, m, 1), new Date(y, m + 1, 0, 23, 59, 59)));
  }
  return Array.from({ length: 8 }, (_, i) => {
    const to = new Date(now); to.setDate(to.getDate() - ((7 - i) * 7));
    const from = new Date(to); from.setDate(from.getDate() - 6); from.setHours(0,0,0,0);
    return make(`${from.getMonth()+1}/${from.getDate()}`, from, to);
  });
}

function trendOf(buckets, field) {
  if (buckets.length < 2) return { arrow:"→", pct:0, color:"#94a3b8" };
  const cur = buckets[buckets.length-1][field], prev = buckets[buckets.length-2][field];
  if (!prev) return cur > 0 ? { arrow:"↑", pct:100, color:GREEN } : { arrow:"→", pct:0, color:"#94a3b8" };
  const change = ((cur - prev) / prev) * 100;
  if (change > 0) return { arrow:"↑", pct:Math.round(change), color:GREEN };
  if (change < 0) return { arrow:"↓", pct:Math.round(-change), color:RED };
  return { arrow:"→", pct:0, color:"#94a3b8" };
}

   7. SOUND + CONFETTI
   ══════════════════════════════════════════════════════════════════════ */

function tone(notes, type = "sine", gain = 0.16) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = type; o.frequency.value = f;
      const at = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(gain, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.42);
      o.start(at); o.stop(at + 0.45);
    });
  } catch (e) {}
}

const playSound = id => { const s = SOUNDS.find(x => x.id === id) || SOUNDS[0]; tone(s.notes); };

function playGong() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ctx.currentTime;
    [[80,1.1,3.4],[160,.55,2.7],[240,.32,2.1],[320,.18,1.7],[480,.1,1.4]].forEach(([f, g, decay]) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.connect(gn); gn.connect(ctx.destination);
      o.type = f < 200 ? "sine" : "triangle";
      o.frequency.setValueAtTime(f * 1.06, t0);
      o.frequency.exponentialRampToValueAtTime(f, t0 + 0.08);
      gn.gain.setValueAtTime(0, t0);
      gn.gain.linearRampToValueAtTime(g, t0 + 0.01);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
      o.start(t0); o.stop(t0 + decay + 0.1);
    });
  } catch (e) {}
}

function useConfetti() {
  const canvasRef = useRef(null), bits = useRef([]), frame = useRef(null);
  const launch = useCallback(() => {
    const cv = canvasRef.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    const colors = ["#6366f1","#ec4899","#f59e0b","#10b981","#ef4444","#8b5cf6","#06b6d4","#fbbf24"];
    const shapes = ["rect","circle","star"];
    const origins = [[cv.width/2, cv.height*.44], [cv.width*.18, cv.height*.5], [cv.width*.82, cv.height*.5]];
    for (let i = 0; i < 300; i++) {
      const [ox, oy] = origins[i % 3];
      const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 13;
      bits.current.push({ x: ox + (Math.random()-.5)*40, y: oy + (Math.random()-.5)*40,
        w: 5 + Math.random()*9, h: 4 + Math.random()*7,
        color: colors[i % colors.length], shape: shapes[i % 3],
        vx: Math.cos(a)*sp*(.6+Math.random()*.8), vy: Math.sin(a)*sp - 8 - Math.random()*5,
        rot: Math.random()*360, rs: (Math.random()-.5)*17, life: 1, decay: .006 + Math.random()*.006 });
    }
    const step = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      bits.current = bits.current.filter(b => b.life > 0);
      bits.current.forEach(b => {
        b.x += b.vx; b.vx *= .99; b.vy += .18; b.y += b.vy; b.rot += b.rs; b.life -= b.decay;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot * Math.PI/180);
        ctx.globalAlpha = Math.max(0, b.life); ctx.fillStyle = b.color;
        if (b.shape === "circle") { ctx.beginPath(); ctx.arc(0,0,b.w/2,0,Math.PI*2); ctx.fill(); }
        else if (b.shape === "star") {
          ctx.beginPath();
          for (let s = 0; s < 5; s++) {
            const o = s*Math.PI*2/5 - Math.PI/2, inn = (s+.5)*Math.PI*2/5 - Math.PI/2;
            ctx.lineTo(Math.cos(o)*b.w/2, Math.sin(o)*b.w/2);
            ctx.lineTo(Math.cos(inn)*b.w/4, Math.sin(inn)*b.w/4);
          }
          ctx.closePath(); ctx.fill();
        } else ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
        ctx.restore();
      });
      if (bits.current.length) frame.current = requestAnimationFrame(step);
    };
    if (frame.current) cancelAnimationFrame(frame.current);
    step();
  }, []);
  return { canvasRef, launch };
}

function Card({ children, T, pad = 18, style }) {

function SectionTitle({ children, T, right }) {

    {right}

}

function Bar({ value, max, color, height = 22, T, label }) {
  const p = pctOf(value, max);
  return <div style={{ height, background:T.sub, borderRadius:height/2, overflow:"hidden", position:"relative" }}>
    <div style={{ width:`${Math.max(p, 1.5)}%`, height:"100%", background:`linear-gradient(90deg,${color}88,${color})`,

function Ring({ pct, color, size = 96, thick = 7, T, center, sub, done }) {

    <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.sub} strokeWidth={thick}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={done ? GREEN : color} strokeWidth={thick}
        strokeDasharray={c} strokeDashoffset={c - (Math.min(pct,100)/100)*c} strokeLinecap="round"
        style={{ transition:"stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)" }}/>
    </svg>

function Modal({ children, onClose, T, width = 660 }) {

   9. CHARTS

function LineChart({ data, field, color, fmt, height = 170, T, id }) {
  const [hover, setHover] = useState(null);
  const W = 540, PL = 54, PR = 16, PT = 20, PB = 30;
  const vals = data.map(d => d[field]);
  const max = Math.max(...vals, 1);
  const x = i => PL + (i / Math.max(data.length - 1, 1)) * (W - PL - PR);
  const y = v => PT + (1 - v / max) * (height - PT - PB);
  const pts = data.map((d, i) => ({ x: x(i), y: y(d[field]) }));

  let path = "";
  if (pts.length > 1) {
    path = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const dx = (pts[i].x - pts[i-1].x) * .38;
      path += ` C${pts[i-1].x+dx},${pts[i-1].y} ${pts[i].x-dx},${pts[i].y} ${pts[i].x},${pts[i].y}`;
    }
  }
  const area = path ? `${path} L${pts[pts.length-1].x},${height-PB} L${pts[0].x},${height-PB} Z` : "";
  const gridLines = [0, 1, 2, 3, 4].map(i => Math.round(max / 4 * i));
  const labelEvery = Math.max(1, Math.ceil(data.length / 7));

  return <div style={{ position:"relative" }} onMouseLeave={() => setHover(null)}>
    <svg viewBox={`0 0 ${W} ${height + 6}`} style={{ width:"100%", height:height + 6, display:"block" }}>
      <defs>
        <linearGradient id={`g${id}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".26"/>
          <stop offset="92%" stopColor={color} stopOpacity=".01"/>
        </linearGradient>
      </defs>
      {gridLines.map((g, i) => <g key={i}>
        <line x1={PL} y1={y(g)} x2={W-PR} y2={y(g)} stroke={T.border} strokeWidth={i ? .7 : 1.2} strokeDasharray={i ? "4,4" : "none"} opacity=".7"/>
        <text x={PL-7} y={y(g)+4} textAnchor="end" fontSize="10" fill={T.muted}>{fmt ? fmt(g) : g}</text>
      </g>)}
      {area && <path d={area} fill={`url(#g${id})`}/>}
      {path && <path d={path} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>}
      <line x1={PL} y1={height-PB} x2={W-PR} y2={height-PB} stroke={T.border} strokeWidth="1.2"/>
      {pts.map((p, i) => {
        const on = hover === i;
        const left = i === 0 ? PL : (pts[i-1].x + p.x) / 2;
        const right = i === pts.length-1 ? W-PR : (p.x + pts[i+1].x) / 2;
        return <g key={i}>
          {on && <line x1={p.x} y1={PT} x2={p.x} y2={height-PB} stroke={color} strokeWidth="1.4" strokeDasharray="4,3" opacity=".6"/>}
          <rect x={left} y={PT} width={Math.max(right-left, 2)} height={height-PT-PB} fill="transparent"
            style={{ cursor:"crosshair" }} onMouseEnter={() => setHover(i)}/>
          {vals[i] > 0 && <circle cx={p.x} cy={p.y} r={on ? 6 : 3.4} fill={on ? color : T.card} stroke={color} strokeWidth={on ? 2.4 : 2}/>}
          {(i % labelEvery === 0 || i === pts.length-1) &&
            <text x={p.x} y={height-PB+15} textAnchor="middle" fontSize="10" fill={T.muted}>{data[i].label}</text>}
        </g>;
      })}
    </svg>
    {hover != null && <div style={{ position:"absolute", left:`${(pts[hover].x / W)*100}%`, top:`${(pts[hover].y/(height+6))*100}%`,
      transform:"translate(-50%,-135%)", background:T.card, border:`2px solid ${color}`, borderRadius:10,
      padding:"6px 12px", pointerEvents:"none", whiteSpace:"nowrap", boxShadow:"0 8px 22px rgba(0,0,0,.18)", zIndex:5 }}>
      <div style={{ fontSize:13, fontWeight:800, color }}>{fmt ? fmt(vals[hover]) : vals[hover]}</div>
      <div style={{ fontSize:10, color:T.muted }}>{data[hover].label}</div>
    </div>}
  </div>;
}

function Donut({ segments, centerVal, centerLabel, T, size = 170 }) {
  const r = 56, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = segments.reduce((a, s) => a + s.value, 0) || 1;
  let offset = 0;
  return <svg width={size} height={size} style={{ display:"block", margin:"0 auto" }}>
    <circle cx={cx} cy={cy} r={r} fill="none" stroke={T.sub} strokeWidth="22"/>
    {segments.map((s, i) => {
      const dash = (s.value / total) * circ;
      const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="22"
        strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-offset} transform={`rotate(-90 ${cx} ${cy})`}/>;
      offset += dash;
      return el;
    })}
    <text x={cx} y={cy-4} textAnchor="middle" fontSize="21" fontWeight="900" fill={T.text}>{centerVal}</text>
    <text x={cx} y={cy+15} textAnchor="middle" fontSize="11" fill={T.muted}>{centerLabel}</text>
  </svg>;
}

function HBars({ items, max, fmt, T }) {

        <span style={{ fontWeight:800, color:it.color }}>{fmt ? fmt(it.value) : it.value}</span>
      </div>
      <Bar value={it.value} max={max} color={it.color} T={T} height={20}/>
    </div>)}
  </div>;
}

    {sorted.map((p, i) => {
      const pct = pctOf(p[field], max), bar = Math.max(pct, 3), lead = i === 0 && p[field] > 0;

            background:"repeating-linear-gradient(90deg,#111 0 6px,#fff 6px 12px)" }}/>
          <div style={{ position:"absolute", bottom:20, right:15, display:"flex", flexDirection:"column", alignItems:"center" }}>

}

          {live && <span style={{ fontSize:9, background:GREEN, color:"#fff", padding:"3px 9px", borderRadius:6, fontWeight:800, whiteSpace:"nowrap" }}>LIVE</span>}
          <button onClick={() => setRows(r => r.filter((_, j) => j !== i))} style={{ ...btn(T,"danger"), padding:"8px 10px" }}>🗑</button>

}

function ProducersModal({ producers, periods, onSave, onClose, T }) {
  const [rows, setRows] = useState(producers.map(p => ({ ...p })));
  const [busy, setBusy] = useState({});
  const [note, setNote] = useState({});
  const [confirm, setConfirm] = useState(null);
  const [revoke, setRevoke] = useState(true);

  const set = (i, f, v) => setRows(r => r.map((x, j) => j === i ? { ...x, [f]: v } : x));

  const add = () => setRows([...rows, {
    id:"p_" + Date.now(), name:"", email:"", avatar:"🧑‍💼",
    color: PALETTE[rows.length % PALETTE.length], gid:"", sheetId:"", sheetUrl:"",
    sound:"chime", goals:{ ...DEFAULT_GOALS }, isNew:true,
  }]);

  const provision = async i => {
    const p = rows[i];
    if (!p.name.trim()) return setNote(n => ({ ...n, [i]:"Add a name first." }));
    if (!p.email || !p.email.includes("@")) return setNote(n => ({ ...n, [i]:"Add their Google email so they can be given edit access." }));
    if (!CONFIG.sheetCreatorUrl) return setNote(n => ({ ...n, [i]:"No sheetCreatorUrl in CONFIG. Deploy the Apps Script, then paste its /exec URL." }));
    if (busy[i]) return;

    setBusy(b => ({ ...b, [i]:true }));
    setNote(n => ({ ...n, [i]:"Creating spreadsheet and folio tabs…" }));
    try {
      const qs = new URLSearchParams({ action:"createSheet", name:p.name.trim(), email:p.email.trim(),
        periods: JSON.stringify(periods.map(x => ({ name:x.name, start:x.start, end:x.end }))) });
      const res = await fetch(`${CONFIG.sheetCreatorUrl}?${qs}`, { redirect:"follow" });
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text.replace(/^\uFEFF/, "").trim()); }
      catch (e) { const m = text.match(/\{[\s\S]*\}/); if (m) { try { data = JSON.parse(m[0]); } catch (e2) {} } }

      if (data && data.success) {
        setRows(r => r.map((x, j) => j === i
          ? { ...x, sheetId:data.sheetId, gid:String(data.gid), sheetUrl:data.url, isNew:false } : x));
        setNote(n => ({ ...n, [i]:`Ready — ${(data.tabs||[]).length} folio tabs, shared with ${p.email}.` }));
      } else {
        setNote(n => ({ ...n, [i]: data && data.error ? "Not created: " + data.error
          : "The script replied with something unexpected. Check it's deployed with access set to Anyone." }));
      }
    } catch (e) {
      setNote(n => ({ ...n, [i]:"Couldn't reach the script: " + e.message }));
    }
    setBusy(b => ({ ...b, [i]:false }));
  };

  const remove = async () => {
    const { index, p } = confirm;
    if (revoke && p.sheetId && CONFIG.sheetCreatorUrl) {
      try { await fetch(`${CONFIG.sheetCreatorUrl}?action=removeProducer&sheetId=${encodeURIComponent(p.sheetId)}`); } catch (e) {}
    }
    setRows(r => r.filter((_, j) => j !== index));
    setConfirm(null);
  };

  if (confirm) return <Modal onClose={() => setConfirm(null)} T={T} width={430}>
    <div style={{ textAlign:"center" }}>
      <div style={{ fontSize:40, marginBottom:10 }}>{confirm.p.avatar}</div>
      <div className="display" style={{ fontSize:22, marginBottom:6 }}>Remove {confirm.p.name || "this producer"}?</div>
      <p style={{ fontSize:13, color:T.text2, lineHeight:1.65, marginBottom:16 }}>
        They come off the dashboard, leaderboards, and goal rollups. Their spreadsheet stays in Drive — nothing is deleted.
      </p>
      {confirm.p.sheetId && <label style={{ display:"flex", gap:10, textAlign:"left", padding:"12px 14px", borderRadius:12,
        background:T.sub, border:`1px solid ${T.line}`, cursor:"pointer", marginBottom:16 }}>
        <input type="checkbox" checked={revoke} onChange={e => setRevoke(e.target.checked)} style={{ marginTop:3 }}/>
        <span style={{ fontSize:12, color:T.text2 }}>
          <b style={{ color:T.text }}>Revoke link sharing too</b><br/>The sheet stops being readable if they're ever re-added by mistake. They keep edit access.
        </span>
      </label>}
      <div style={{ display:"flex", gap:10 }}>
        <button onClick={() => setConfirm(null)} style={{ ...btn(T), flex:1, padding:12 }}>Keep them</button>
        <button onClick={remove} style={{ ...btn(T,"danger"), flex:1, padding:12 }}>Remove producer</button>
      </div>
    </div>
  </Modal>;

  return <Modal onClose={onClose} T={T} width={720}>
    <ModalHead title="👥 Manage producers" onClose={onClose} T={T}
      sub="Adding someone builds their sales log automatically — one tab per period, columns already matched."/>
    {rows.map((p, i) => {
      const msg = note[i];
      const bad = msg && /Not created|Couldn't|No sheetCreatorUrl|unexpected|Add a|Add their/.test(msg);
      return <div key={p.id} style={{ padding:14, borderRadius:14, marginBottom:10,
        background: p.isNew ? GREEN + "0b" : T.sub, border:`1px solid ${p.isNew ? GREEN + "44" : T.line}` }}>
        {p.isNew && <div style={{ fontSize:10, fontWeight:800, color:GREEN, marginBottom:8, letterSpacing:1 }}>NEW PRODUCER</div>}
        <div style={{ display:"flex", gap:8, marginBottom:8, alignItems:"center" }}>
          <input value={p.name} onChange={e => set(i,"name",e.target.value)}
            onBlur={() => { if (p.isNew && !p.sheetId && p.name.trim() && (p.email||"").includes("@")) provision(i); }}
            placeholder="Producer name" style={{ ...input(T), background:T.card }}/>
          <select value={p.avatar} onChange={e => set(i,"avatar",e.target.value)}
            style={{ ...input(T), width:"auto", fontSize:18, background:T.card }}>
            {AVATARS.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <input type="color" value={p.color} onChange={e => set(i,"color",e.target.value)} title="Producer color"
            style={{ width:38, height:38, border:"none", borderRadius:9, cursor:"pointer", background:"none" }}/>
          <button onClick={() => setConfirm({ index:i, p })} title="Remove"
            style={{ ...btn(T,"danger"), padding:"9px 11px" }}>🗑</button>
        </div>
        <input value={p.email || ""} onChange={e => set(i,"email",e.target.value)}
          onBlur={() => { if (p.isNew && !p.sheetId && p.name.trim() && (p.email||"").includes("@")) provision(i); }}
          placeholder="Google email — grants them edit access to their sheet"
          style={{ ...input(T), background:T.card, fontSize:12, marginBottom:9 }}/>

        {busy[i] ? <div style={{ padding:"10px 14px", borderRadius:11, background:GREEN+"10", border:`1px solid ${GREEN}44`,
            fontSize:12, color:GREEN, fontWeight:700, marginBottom:9 }}>
            <span style={{ display:"inline-block", animation:"spin 1s linear infinite", marginRight:8 }}>⏳</span>Creating spreadsheet and folio tabs…
          </div>
        : p.sheetId ? <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap", padding:"9px 13px",
            borderRadius:11, background:GREEN+"12", border:`1px solid ${GREEN}44`, marginBottom:9 }}>
            <span style={{ fontSize:12, color:GREEN, fontWeight:800 }}>✓ Sheet linked</span>
            {p.sheetUrl && <a href={p.sheetUrl} target="_blank" rel="noreferrer" style={{ fontSize:11, color:GREEN, fontWeight:700 }}>Open sheet ↗</a>}
            <a href={csvByGid(p.sheetId, p.gid || 0)} target="_blank" rel="noreferrer" style={{ fontSize:11, color:INDIGO, fontWeight:700 }}>Test CSV feed ↗</a>
          </div>
        : <button onClick={() => provision(i)} style={{ ...btn(T,"go"), width:"100%", padding:11, marginBottom:9 }}>
            📄 Create sales log for {p.name.trim() || "this producer"}
          </button>}

        {msg && <div style={{ fontSize:11, marginBottom:9, fontWeight:700, color: bad ? RED : GREEN }}>{msg}</div>}

        <details style={{ marginBottom:9 }}>
          <summary style={{ fontSize:11, color:T.muted, cursor:"pointer", fontWeight:700 }}>Advanced — link an existing sheet</summary>
          <div style={{ display:"flex", gap:8, marginTop:9, flexWrap:"wrap" }}>
            <input value={p.sheetId || ""} onChange={e => set(i,"sheetId",e.target.value)} placeholder="Sheet ID"
              style={{ ...input(T), background:T.card, fontSize:11, flex:3, minWidth:150 }}/>
            <input value={p.gid || ""} onChange={e => set(i,"gid",e.target.value)} placeholder="GID"
              style={{ ...input(T), background:T.card, fontSize:11, flex:1, minWidth:80 }}/>
            <select value={p.sound} onChange={e => set(i,"sound",e.target.value)} style={{ ...input(T), background:T.card, width:"auto", fontSize:12 }}>
              {SOUNDS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <button onClick={() => playSound(p.sound)} style={{ ...btn(T), padding:"7px 10px" }}>▶</button>
          </div>
        </details>

        <div style={{ padding:"11px 13px", background:T.card, borderRadius:11, border:`1px solid ${T.line}` }}>
          <div style={{ fontSize:10, fontWeight:800, color:T.muted, marginBottom:8, letterSpacing:1 }}>PERIOD GOALS</div>
          <div className="grid5">
            {[["premium","Premium $"],["policies","Policies"],["personalLines","Pers. Lines"],["life","Life"],["commercial","Commercial"]].map(([f,label]) =>
              <div key={f}>
                <div style={{ fontSize:9, color:T.muted, marginBottom:3 }}>{label}</div>
                <input type="number" value={(p.goals || {})[f] ?? ""} onChange={e => set(i,"goals",{ ...(p.goals||{}), [f]:Number(e.target.value) })}
                  style={{ ...input(T), padding:"6px 8px", fontSize:11 }}/>
              </div>)}
          </div>
        </div>
      </div>;
    })}
    <button onClick={add} style={{ ...btn(T,"go"), width:"100%", padding:12, marginBottom:14 }}>+ Add producer</button>
    <div style={{ display:"flex", gap:10 }}>
      <button onClick={onClose} style={{ ...btn(T), flex:1, padding:12 }}>Cancel</button>
      <button onClick={() => {
        const keep = rows.filter(p => p.name.trim() && p.sheetId);
        const lost = rows.length - keep.length;
        if (lost && !window.confirm(`${lost} producer${lost === 1 ? "" : "s"} without a linked sheet won't be saved. Continue?`)) return;
        onSave(keep.map(({ isNew, ...p }) => p)); onClose();
      }} style={{ ...btn(T,"primary"), flex:1, padding:12 }}>Save producers</button>
    </div>
  </Modal>;
}

/* ══════════════════════════════════════════════════════════════════════
   12. APP
   ══════════════════════════════════════════════════════════════════════ */

function App() {
  /* ── State ─────────────────────────────────────────────────────────── */
  const [dark, setDark] = useState(() => load("dark", false));
  const [producersCfg, setProducersCfg] = useState(() => {
    // Self-healing: pinned sheet IDs from source always win over cached config.
    let cfg = load("producers", null);
    if (!Array.isArray(cfg) || !cfg.length) cfg = DEFAULT_PRODUCERS;
    cfg = cfg.map(p => {
      const id = p.id === "stephanie" ? "aja" : p.id;
      return { ...p, id, name: p.id === "stephanie" ? "A'ja" : p.name,
        sheetId: SHEET_IDS[id] || p.sheetId || "", goals: { ...DEFAULT_GOALS, ...(p.goals || {}) } };
    });
    DEFAULT_PRODUCERS.forEach(d => { if (!cfg.some(p => p.id === d.id)) cfg.push({ ...d }); });
    save("producers", cfg);
    return cfg;
  });
  const [periods, setPeriods] = useState(() => load("periods", DEFAULT_PERIODS));
  const [periodIdx, setPeriodIdx] = useState(() => currentPeriodIndex(load("periods", DEFAULT_PERIODS)));
  const [pinnedPeriod, setPinnedPeriod] = useState(false);
  const [teamGoals, setTeamGoals] = useState(() => load("teamGoals", DEFAULT_TEAM_GOALS));
  const [messages, setMessages] = useState(() => load("messages", []));
  const [meId, setMeId] = useState(() => load("meId", null));

  const [raw, setRaw] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [log, setLog] = useState([]);
  const [ctm, setCtm] = useState(null);

  const [tab, setTab] = useState("dashboard");
  const [whoId, setWhoId] = useState(producersCfg[0]?.id || "joey");
  const [trendMode, setTrendMode] = useState("weekly");

  const [modal, setModal] = useState(null);
  const [admin, setAdmin] = useState(false);
  const [adminLeft, setAdminLeft] = useState(0);
  const [toast, setToast] = useState(null);
  const [cheer, setCheer] = useState(null);

  const T = dark ? DARK : LIGHT;
  const { canvasRef, launch } = useConfetti();
  const period = periods[periodIdx];
  const isLivePeriod = periodIdx === currentPeriodIndex(periods);
  const locked = !admin && !!meId;

  const prevTotals = useRef({});
  const celebrated = useRef(new Set(load("celebrated", [])));
  const adminTimers = useRef({});

  /* ── Logging ───────────────────────────────────────────────────────── */
  const addLog = useCallback((msg, kind = "info") => {
    setLog(l => [{ id: Math.random(), time: new Date().toLocaleTimeString(), msg, kind }, ...l].slice(0, 60));
  }, []);

  /* ── Celebrations ──────────────────────────────────────────────────── */
  const celebrate = useCallback((key, title, icon, sub) => {
    const full = (period?.name || "all") + "|" + key;
    if (celebrated.current.has(full)) return;
    celebrated.current.add(full);
    save("celebrated", [...celebrated.current]);
    setCheer({ title, icon, sub });
    tone([392,523.25,659.25,783.99,1046.5,1318.5], "triangle", 0.24);
    launch();
    setTimeout(() => setCheer(null), 6500);
  }, [period, launch]);

  /* ── Fetch ─────────────────────────────────────────────────────────── */
  const syncAll = useCallback(async () => {
    addLog("Sync started", "info");
    const results = [];
    for (const p of producersCfg) {
      const sales = await fetchProducerSales(p, periods, addLog);
      results.push({ ...p, allSales: sales });
    }
    setRaw(results);
    setLastSync(new Date());
    setLoading(false);
    const total = results.reduce((a, r) => a + r.allSales.length, 0);
    addLog(total ? `Sync complete — ${total} policies across ${results.length} producers`
                 : "Sync complete — no policies found. Check sharing on each sheet.", total ? "ok" : "err");
  }, [producersCfg, periods, addLog]);

  const syncCtm = useCallback(async () => {
    if (!CONFIG.ctmUrl) return;
    try {
      const r = await fetch(CONFIG.ctmUrl, { redirect:"follow" });
      const d = JSON.parse(await r.text());
      setCtm(d.producers || d.ctm || d.data || null);
      addLog("CTM call data loaded", "ok");
    } catch (e) { addLog("CTM unreachable: " + e.message, "warn"); }
  }, [addLog]);

  useEffect(() => { syncAll(); syncCtm(); /* eslint-disable-next-line */ }, []);
  useEffect(() => { const t = setInterval(() => syncAll(), CONFIG.refreshMs); return () => clearInterval(t); }, [syncAll]);
  useEffect(() => {
    if (pinnedPeriod) return;
    const t = setInterval(() => setPeriodIdx(currentPeriodIndex(periods)), 60 * 60 * 1000);
    return () => clearInterval(t);
  }, [periods, pinnedPeriod]);

  const refresh = async () => { setBusy(true); await Promise.all([syncAll(), syncCtm()]); setBusy(false); };

  /* ── Derived ───────────────────────────────────────────────────────── */
  const producers = useMemo(() => raw.map(p => {
    const sales = inPeriod(p.allSales, period);
    return { ...p, sales, premium: sales.reduce((a, s) => a + s.price, 0), policies: sales.length };
  }), [raw, period]);

  const teamPremium = producers.reduce((a, p) => a + p.premium, 0);
  const teamPolicies = producers.reduce((a, p) => a + p.policies, 0);
  const teamLines = splitLines(producers.flatMap(p => p.sales));
  const teamPolicyGoal = Number(teamGoals.personalLines||0) + Number(teamGoals.life||0) + Number(teamGoals.commercial||0);
  const ranked = [...producers].sort((a, b) => b.premium - a.premium);

  const me = producers.find(p => p.id === whoId) || producers[0];
  const mySales = me?.sales || [];
  const myLines = splitLines(mySales);
  const myBadges = earnedBadges(mySales);
  const myXP = calcXP(mySales);
  const myLevel = levelOf(myXP);
  const myRank = ranked.findIndex(p => p.id === whoId) + 1;
  const myCtm = ctm ? (ctm[me?.name] || ctm[firstName(me?.name)] || null) : null;
  const buckets = useMemo(() => bucketSales(me?.allSales || [], trendMode, periods), [me, trendMode, periods]);

  const reviews = producers.flatMap(p => p.sales.filter(s => s.review)
    .map(s => ({ ...s, who:p.name, avatar:p.avatar, color:p.color })));

  /* ── New-policy toast + goal celebrations ──────────────────────────── */
  useEffect(() => {
    if (loading || !producers.length) return;
    let fired = false;
    producers.forEach(p => {
      const before = prevTotals.current[p.id];
      if (before != null && p.policies > before && !fired) {
        const newest = p.sales[p.sales.length - 1];
        if (newest) { setToast({ ...newest, who:p.name }); playGong(); launch(); fired = true; }
      }
      prevTotals.current[p.id] = p.policies;
    });

    if (teamGoals.premium > 0 && teamPremium >= teamGoals.premium)
      celebrate("team-premium", "Team premium goal hit", "🏆", short(teamPremium) + " bound this period");
    if (teamPolicyGoal > 0 && teamPolicies >= teamPolicyGoal)
      celebrate("team-policies", "Team policy goal hit", "🎯", teamPolicies + " policies bound this period");
    producers.forEach(p => {
      const g = p.goals || {}, l = splitLines(p.sales);
      if (g.premium > 0 && p.premium >= g.premium) celebrate(p.id + "-prem", firstName(p.name) + " hit their premium goal", "💰", short(p.premium));
      if (g.policies > 0 && p.policies >= g.policies) celebrate(p.id + "-pol", firstName(p.name) + " hit their policy goal", "📋", p.policies + " policies");
      if (g.life > 0 && l.life.count >= g.life) celebrate(p.id + "-life", firstName(p.name) + " hit their life goal", "❤️", l.life.count + " life policies");
      if (g.commercial > 0 && l.commercial.count >= g.commercial) celebrate(p.id + "-comm", firstName(p.name) + " hit their commercial goal", "🏢", l.commercial.count + " commercial");
    });
  }, [producers, loading]); // eslint-disable-line

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 9000); return () => clearTimeout(t); } }, [toast]);

  /* ── Persistence helpers ───────────────────────────────────────────── */
  const persist = {
    producers: v => { setProducersCfg(v); save("producers", v); setTimeout(() => syncAll(), 250); },
    periods:   v => { setPeriods(v); save("periods", v); if (!pinnedPeriod) setPeriodIdx(currentPeriodIndex(v)); },
    teamGoals: v => { setTeamGoals(v); save("teamGoals", v); },
    messages:  v => { setMessages(v); save("messages", v); },
    dark:      v => { setDark(v); save("dark", v); },
    meId:      v => { setMeId(v); save("meId", v); if (v) setWhoId(v); },
  };

  const unlockAdmin = () => {
    setAdmin(true); setAdminLeft(300);
    clearInterval(adminTimers.current.tick); clearTimeout(adminTimers.current.off);
    adminTimers.current.tick = setInterval(() => setAdminLeft(s => Math.max(0, s - 1)), 1000);
    adminTimers.current.off = setTimeout(() => {
      clearInterval(adminTimers.current.tick);
      setAdmin(false); setTab(t => t === "admin" ? "dashboard" : t);
    }, 300000);
  };
  useEffect(() => () => { clearInterval(adminTimers.current.tick); clearTimeout(adminTimers.current.off); }, []);

  const openGated = target => admin ? setModal(target) : setModal({ gate: target });

  /* ── Tabs ──────────────────────────────────────────────────────────── */
  const TABS = [
    { id:"dashboard",   label:"Dashboard",   icon:"📊" },
    { id:"goals",       label:"Goals",       icon:"🎯" },
    { id:"leaderboard", label:"Leaderboard", icon:"🏁" },
    { id:"trends",      label:"Trends",      icon:"📈" },
    { id:"team",        label:"Team KPIs",   icon:"📉" },
    { id:"badges",      label:"Badges",      icon:"🏆" },
    { id:"breakdown",   label:"Breakdown",   icon:"🧩" },
    { id:"reviews",     label:"Reviews",     icon:"⭐" },
    ...(admin ? [{ id:"admin", label:"Admin", icon:"🔐" }] : []),
  ];

  const quote = QUOTES[(new Date().getFullYear()*366 + new Date().getMonth()*31 + new Date().getDate()) % QUOTES.length];

  /* ══════════════════════════════════════════════════════════════════ */
  return <div className="wrap" style={{ minHeight:"100vh", background:T.bg, color:T.text, padding:18 }}>
    <canvas ref={canvasRef} style={{ position:"fixed", inset:0, width:"100%", height:"100%", pointerEvents:"none", zIndex:8500 }}/>

    {loading && <div style={{ position:"fixed", inset:0, background:T.bg, zIndex:9500, display:"flex",
      flexDirection:"column", alignItems:"center", justifyContent:"center", gap:14 }}>
      <div style={{ fontSize:52, animation:"spin 1.4s linear infinite" }}>🏁</div>
      <div className="display" style={{ fontSize:26 }}>Loading Battle Royale</div>
      <div style={{ fontSize:13, color:T.muted }}>Reading every folio tab across {producersCfg.length} sheets…</div>
    </div>}

    {cheer && <div style={{ position:"fixed", inset:0, zIndex:8600, display:"flex", alignItems:"center",
      justifyContent:"center", pointerEvents:"none", padding:20 }}>
      <div style={{ textAlign:"center", padding:"38px 54px", borderRadius:26, maxWidth:460,
        background:`linear-gradient(135deg,${NAVY},${INDIGO} 60%,#7c3aed)`, border:"3px solid rgba(255,255,255,.28)",
        boxShadow:"0 24px 80px rgba(0,0,0,.45)", animation:"popIn .45s cubic-bezier(.2,1.2,.4,1)" }}>
        <div style={{ fontSize:74, lineHeight:1, animation:"pulse 1s infinite" }}>{cheer.icon}</div>
        <div className="display" style={{ fontSize:34, color:"#fff", marginTop:8 }}>{cheer.title}</div>
        <div style={{ fontSize:15, color:"#c7d2fe", fontWeight:600, marginTop:4 }}>{cheer.sub}</div>
      </div>
    </div>}

    {toast && <div style={{ position:"fixed", top:18, left:"50%", zIndex:8700, animation:"toastIn .45s",
      background:T.card, borderRadius:16, padding:"15px 22px", display:"flex", gap:14, alignItems:"center",
      maxWidth:520, boxShadow:"0 12px 40px rgba(0,0,0,.22)", border:`1px solid ${T.border}` }}>
      <div style={{ fontSize:34 }}>🎉</div>
      <div style={{ flex:1 }}>
        <div style={{ fontSize:14, fontWeight:800 }}>New policy bound</div>
        <div style={{ fontSize:13, color:T.text2 }}>{toast.who} closed <b>{toast.name}</b> — <b style={{ color:GREEN }}>{money(toast.price)}</b></div>
      </div>
      <button onClick={() => setToast(null)} style={{ background:"none", border:"none", fontSize:20, cursor:"pointer", color:T.muted }}>×</button>
    </div>}

    {/* ── Modals ── */}
    {modal?.gate && <PasswordGate T={T} onClose={() => setModal(null)}
      onPass={() => { unlockAdmin(); setModal(modal.gate === "adminTab" ? null : modal.gate); if (modal.gate === "adminTab") setTab("admin"); }}/>}
    {modal === "producers" && <ProducersModal producers={producersCfg} periods={periods} T={T}
      onSave={persist.producers} onClose={() => setModal(null)}/>}
    {modal === "periods" && <PeriodsModal periods={periods} T={T} onSave={persist.periods} onClose={() => setModal(null)}/>}
    {modal === "teamGoals" && <TeamGoalsModal goals={teamGoals} T={T} onSave={persist.teamGoals} onClose={() => setModal(null)}/>}
    {modal === "messages" && <MessagesModal messages={messages} T={T} onSave={persist.messages} onClose={() => setModal(null)}/>}
    {modal === "avatar" && <PickerModal title="Choose your avatar" T={T} current={me?.avatar}
      options={AVATARS.map(a => ({ id:a, label:a }))} onClose={() => setModal(null)}
      onPick={a => persist.producers(producersCfg.map(p => p.id === whoId ? { ...p, avatar:a } : p))}/>}
    {modal === "sound" && <PickerModal title="🔊 Choose your victory sound" T={T} preview current={me?.sound}
      options={SOUNDS.map(s => ({ id:s.id, label:s.name }))} onClose={() => setModal(null)}
      onPick={s => persist.producers(producersCfg.map(p => p.id === whoId ? { ...p, sound:s } : p))}/>}
    {modal === "who" && <Modal onClose={() => setModal(null)} T={T} width={430}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontSize:36, marginBottom:8 }}>👤</div>
        <div className="display" style={{ fontSize:23, marginBottom:4 }}>Who's watching?</div>
        <p style={{ fontSize:12, color:T.muted, marginBottom:18 }}>Locks the dashboard to your own numbers. Team views stay open.</p>
        {producersCfg.map(p => <button key={p.id} onClick={() => { persist.meId(p.id); setModal(null); }}
          style={{ display:"flex", alignItems:"center", gap:14, width:"100%", padding:"13px 17px", borderRadius:14,
            border:`1px solid ${T.border}`, background:T.sub, cursor:"pointer", marginBottom:8, color:T.text }}>
          <span style={{ fontSize:26 }}>{p.avatar}</span>
          <span style={{ flex:1, textAlign:"left", fontSize:14, fontWeight:700 }}>{p.name}</span>
          <span style={{ color:T.muted }}>→</span>
        </button>)}
        <button onClick={() => setModal(null)} style={{ ...btn(T), width:"100%", padding:11, marginTop:6 }}>Just browsing</button>
      </div>
    </Modal>}

    <div style={{ maxWidth:1240, margin:"0 auto" }}>

      {/* ── Header ── */}
      <header style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14, flexWrap:"wrap" }}>
        <div style={{ width:56, height:56, borderRadius:15, flexShrink:0, display:"flex", alignItems:"center",
          justifyContent:"center", background:`linear-gradient(135deg,${NAVY},${INDIGO})`, boxShadow:"0 6px 18px rgba(26,60,110,.34)" }}>
          <span className="display" style={{ fontSize:25, color:"#fff" }}>YDI</span>
        </div>
        <div style={{ flex:1, minWidth:180 }}>
          <div className="display" style={{ fontSize:27, lineHeight:1.05 }}>{CONFIG.app}</div>
          <div style={{ fontSize:11, color:T.muted, letterSpacing:1.6, textTransform:"uppercase", fontWeight:600 }}>
            {CONFIG.agency} · v{CONFIG.version}
          </div>
        </div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", justifyContent:"flex-end" }}>
          <button onClick={() => persist.dark(!dark)} title="Toggle theme" style={{ ...btn(T), padding:"9px 12px" }}>{dark ? "☀️" : "🌙"}</button>
          <button onClick={() => openGated("messages")} style={{ ...btn(T), padding:"9px 12px" }}>📋 Board</button>
          <button onClick={() => admin ? setTab("admin") : setModal({ gate:"adminTab" })}
            style={{ ...btn(T), padding:"9px 12px", borderColor: admin ? INDIGO : T.border, color: admin ? INDIGO : T.text2 }}>
            {admin ? "🔓 Admin" : "🔐 Admin"}
          </button>
          <button onClick={refresh} disabled={busy} style={{ ...btn(T,"primary"), padding:"9px 14px", opacity: busy ? .6 : 1 }}>
            {busy ? "Syncing…" : "↻ Refresh"}
          </button>
        </div>
      </header>

      {/* ── Identity row ── */}
      <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:11, flexWrap:"wrap" }}>
        <div onClick={() => setModal("avatar")} title="Change avatar" style={{ width:52, height:52, borderRadius:15,
          cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontSize:26,
          background:`linear-gradient(135deg,${me?.color || INDIGO},${me?.color || INDIGO}bb)`,
          boxShadow:`0 5px 16px ${me?.color || INDIGO}44` }}>{me?.avatar || "👤"}</div>
        <div style={{ flex:1, minWidth:170 }}>
          <div style={{ fontSize:19, fontWeight:800 }}>{me?.name || "—"}</div>
          <div style={{ fontSize:12, color:T.muted, display:"flex", gap:9, flexWrap:"wrap" }}>
            <span>Rank #{myRank || "—"}</span><span>Level {myLevel.level}</span><span>{myXP.toLocaleString()} XP</span>
            {myCtm && <span>📞 {myCtm.answeredCalls || 0} calls</span>}
            {locked && <span style={{ background:GREEN+"1a", color:GREEN, padding:"1px 9px", borderRadius:6, fontWeight:700 }}>🔒 Your view</span>}
          </div>
        </div>
        {!admin && !meId && <button onClick={() => setModal("who")} style={{ ...btn(T,"primary"), padding:"8px 13px" }}>👤 Who am I?</button>}
        {meId && !admin && <button onClick={() => persist.meId(null)} style={{ ...btn(T), padding:"8px 12px", fontSize:11 }}>Switch</button>}
        <button onClick={() => setModal("sound")} title="Victory sound" style={{ ...btn(T), padding:"9px 12px" }}>🔊</button>
      </div>

      {myLevel.next && <div style={{ marginBottom:13 }}>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:T.muted, marginBottom:4 }}>
          <span>Level {myLevel.level}</span>
          <span>{(myXP - myLevel.floor).toLocaleString()} / {(myLevel.next - myLevel.floor).toLocaleString()} XP to level {myLevel.level + 1}</span>
        </div>
        <Bar value={myXP - myLevel.floor} max={myLevel.next - myLevel.floor} color={me?.color || INDIGO} T={T} height={18}/>
      </div>}

      {/* ── Period selector ── */}
      <div style={{ display:"flex", alignItems:"center", gap:9, marginBottom:11, padding:"9px 14px", borderRadius:12,
        background: isLivePeriod ? GREEN + "0a" : AMBER + "0d", border:`1px solid ${isLivePeriod ? GREEN + "33" : AMBER + "44"}` }}>
        <span style={{ fontSize:15 }}>📅</span>
        <select value={periodIdx} onChange={e => { const v = Number(e.target.value); setPeriodIdx(v); setPinnedPeriod(v !== currentPeriodIndex(periods)); }}
          style={{ ...input(T), background:T.card, fontWeight:600, flex:1, cursor:"pointer" }}>
          {periods.map((p, i) => <option key={i} value={i}>
            {p.name}{i === currentPeriodIndex(periods) ? " · live" : ""} — {prettyDate(p.start)} to {prettyDate(p.end)}
          </option>)}
        </select>
        {admin && <button onClick={() => setModal("periods")} style={{ ...btn(T), padding:"7px 11px" }}>⚙️</button>}
        {pinnedPeriod && <button onClick={() => { setPinnedPeriod(false); setPeriodIdx(currentPeriodIndex(periods)); }}
          style={{ ...btn(T), padding:"7px 11px", fontSize:11, background:"#fef3c7", color:"#92400e", borderColor:"#fde68a" }}>↺ Live</button>}
      </div>

      {/* ── Sync status ── */}
      {lastSync && <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12, fontSize:12, flexWrap:"wrap" }}>
        <span style={{ width:7, height:7, borderRadius:"50%", background: teamPolicies ? GREEN : RED, animation:"pulse 2.2s infinite" }}/>
        <span style={{ color:T.muted }}>Synced {lastSync.toLocaleTimeString()} · auto every {CONFIG.refreshMs/60000} min</span>
        <span style={{ color: teamPolicies ? GREEN : RED, fontWeight:700 }}>
          {teamPolicies ? `${teamPolicies} policies this period` : "No policies found — open Admin to see why"}
        </span>
      </div>}

      {/* ── Producer tabs ── */}
      <div style={{ display:"flex", gap:7, marginBottom:14, flexWrap:"wrap" }}>
        {producers.map(p => {
          const on = p.id === whoId, canSee = admin || !meId || p.id === meId;
          const lead = ranked[0]?.id === p.id && p.premium > 0;
          return <button key={p.id} className="prodtab" onClick={() => canSee && setWhoId(p.id)}
            style={{ display:"flex", alignItems:"center", gap:9, padding:"9px 14px", borderRadius:14, flex:1, minWidth:132,
              cursor: canSee ? "pointer" : "default", opacity: canSee ? 1 : .38, color: on ? T.text : T.text2,
              background: on ? p.color + "0f" : T.card, border:`1px solid ${on ? p.color + "55" : T.border}` }}>
            <span style={{ fontSize:21, position:"relative" }}>
              {p.avatar}{lead && <span style={{ position:"absolute", top:-9, right:-9, fontSize:11 }}>👑</span>}
            </span>
            <span style={{ textAlign:"left", flex:1, minWidth:0 }}>
              <span style={{ display:"block", fontSize:12, fontWeight:700 }}>{firstName(p.name)}</span>
              <span style={{ display:"block", fontSize:11, color: on ? p.color : T.muted }}>{short(p.premium)} · {p.policies} pol</span>
            </span>
            {!canSee && <span style={{ fontSize:11 }}>🔒</span>}
          </button>;
        })}
      </div>

      {/* ── Tab bar ── */}
      <nav className="tabbar" style={{ display:"flex", gap:3, marginBottom:20, background:T.sub, borderRadius:14, padding:4, overflowX:"auto" }}>
        {TABS.map(t => <button key={t.id} onClick={() => setTab(t.id)}
          style={{ flex:1, minWidth:80, padding:"10px 6px", borderRadius:10, border:"none", cursor:"pointer",
            fontSize:11, fontWeight:700, whiteSpace:"nowrap",
            background: tab === t.id ? T.card : "transparent",
            color: tab === t.id ? (me?.color || INDIGO) : T.muted,
            boxShadow: tab === t.id ? T.shadow : "none" }}>{t.icon} {t.label}</button>)}
      </nav>

      {/* ══════ DASHBOARD ══════ */}
      {tab === "dashboard" && <div style={{ animation:"rise .35s" }}>
        {/* Team goal banner */}
        <div style={{ borderRadius:20, overflow:"hidden", marginBottom:14, boxShadow:"0 10px 34px rgba(15,23,42,.16)" }}>
          <div style={{ background:`linear-gradient(135deg,${NAVY} 0%,#2563eb 58%,#7c3aed 100%)`, padding:"20px 24px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:15, flexWrap:"wrap", gap:8 }}>
              <div>
                <div style={{ fontSize:11, fontWeight:800, color:"#93c5fd", letterSpacing:2 }}>TEAM GOALS</div>
                <div className="display" style={{ fontSize:24, color:"#fff" }}>{period?.name || "All time"}</div>
              </div>
              {admin && <button onClick={() => setModal("teamGoals")} style={{ padding:"7px 13px", borderRadius:9,
                border:"1px solid rgba(255,255,255,.32)", background:"rgba(255,255,255,.12)", color:"#fff",
                fontSize:12, fontWeight:700, cursor:"pointer" }}>Edit goals</button>}
            </div>
            <div className="grid2">
              {[{ label:"TOTAL PREMIUM", val:teamPremium, goal:teamGoals.premium, fmt:short, accent:"#fde68a", bar:"linear-gradient(90deg,#fbbf24,#f59e0b)" },
                { label:"TOTAL POLICIES", val:teamPolicies, goal:teamPolicyGoal, accent:"#a5b4fc", bar:"linear-gradient(90deg,#818cf8,#6366f1)" }].map((g, i) => {
                const p = pctOf(g.val, g.goal), done = p >= 100;
                return <div key={i} style={{ background:"rgba(255,255,255,.11)", borderRadius:15, padding:"15px 17px", border:"1px solid rgba(255,255,255,.2)" }}>
                  <div style={{ fontSize:11, color:g.accent, fontWeight:800, letterSpacing:1, marginBottom:6 }}>{g.label}</div>
                  <div className="display" style={{ fontSize:38, color:"#fff", lineHeight:1 }}>{g.fmt ? g.fmt(g.val) : g.val}</div>
                  <div style={{ fontSize:12, color:"#bfdbfe", marginTop:5 }}>
                    Goal {g.fmt ? g.fmt(g.goal) : g.goal}{done ? " · reached" : ` · ${g.fmt ? g.fmt(Math.max(0, g.goal - g.val)) : Math.max(0, g.goal - g.val)} to go`}
                  </div>
                  <div style={{ marginTop:11, height:10, background:"rgba(0,0,0,.26)", borderRadius:5, overflow:"hidden" }}>
                    <div style={{ width:`${p}%`, height:"100%", background: done ? "#4ade80" : g.bar, borderRadius:5, transition:"width 1.3s cubic-bezier(.22,1,.36,1)" }}/>
                  </div>
                  <div style={{ fontSize:11, color:g.accent, fontWeight:800, marginTop:5 }}>{Math.round(p)}% of goal</div>
                </div>;
              })}
            </div>
          </div>
          <div style={{ background:T.card, padding:"14px 18px" }}>
            <div style={{ fontSize:10, color:T.muted, fontWeight:700, letterSpacing:1.2, marginBottom:9 }}>PREMIUM TIERS</div>
            <div style={{ display:"flex", gap:6 }}>
              {TIERS.map((t, i) => { const hit = teamPremium >= t.target;
                return <div key={i} style={{ flex:1, textAlign:"center", padding:"11px 4px", borderRadius:11,
                  background: hit ? AMBER + "12" : T.sub, border:`${hit ? 2 : 1}px solid ${hit ? AMBER : T.line}` }}>
                  <div style={{ fontSize:21 }}>{hit ? "✅" : t.icon}</div>
                  <div style={{ fontSize:10, fontWeight:800, color: hit ? t.color : T.muted, marginTop:3 }}>{t.name}</div>
                  <div style={{ fontSize:9, color:T.muted }}>${t.target/1000}K</div>
                </div>;
              })}
            </div>
          </div>
        </div>

        {/* Quote */}
        <div style={{ background:`linear-gradient(135deg,${NAVY},#2563eb)`, borderRadius:16, padding:"24px 28px",
          marginBottom:14, textAlign:"center", position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", top:-24, right:-14, fontSize:92, opacity:.07 }}>”</div>
          <div style={{ fontSize:10, fontWeight:700, color:"#93c5fd", letterSpacing:3, marginBottom:10 }}>DAILY MOTIVATION</div>
          <div style={{ fontSize:18, fontWeight:700, color:"#fff", lineHeight:1.6, fontStyle:"italic" }}>“{quote[0]}”</div>
          <div style={{ fontSize:12, color:"#93c5fd", fontWeight:600, marginTop:10 }}>— {quote[1]}</div>
        </div>

        {/* Messages */}
        {!!messages.length && <Card T={T} style={{ marginBottom:14, background:"#eff6ff", borderColor:"#bfdbfe" }}>
          <SectionTitle T={T} right={<span style={{ fontSize:12, color:"#2563eb", background:"#dbeafe", padding:"2px 9px", borderRadius:10, fontWeight:700 }}>{messages.length}</span>}>
            <span style={{ color:"#1e40af" }}>📋 Message board</span>
          </SectionTitle>
          {[...messages.filter(m => m.pinned), ...messages.filter(m => !m.pinned)].slice(0, 5).map(m =>
            <div key={m.id} style={{ padding:"14px 18px", borderRadius:13, marginBottom:8, textAlign:"center",
              background: m.pinned ? "#fefce8" : "#fff", border:`1px solid ${m.pinned ? "#fde68a" : "#bfdbfe"}` }}>
              {m.pinned && <div style={{ fontSize:8, background:AMBER, color:"#fff", padding:"2px 10px", borderRadius:4,
                fontWeight:800, display:"inline-block", marginBottom:6 }}>PINNED</div>}
              <div style={{ fontSize:26, marginBottom:5 }}>{m.emoji}</div>
              <div style={{ fontSize:14, fontWeight:700, color:"#1e3a5f", lineHeight:1.55 }}>{m.text}</div>
              <div style={{ fontSize:11, color:"#3b82f6", marginTop:6 }}>— {m.author} · {m.stamp}</div>
            </div>)}
        </Card>}

        {/* Personal stats */}
        <div className="grid4" style={{ marginBottom:14 }}>
          {[{ l:"Premium", v:money(me?.premium || 0), s:"this period", c:GREEN },
            { l:"Policies", v:me?.policies || 0, s:`${myLines.life.count} life · ${myLines.commercial.count} comm`, c:me?.color || INDIGO },

        <Card T={T} style={{ marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
          <div>
            <span className="display" style={{ fontSize:32 }}>{myBadges.filter(b => b.earned).length}</span>
            <span style={{ fontSize:15, color:T.muted }}> of {BADGES.length} earned</span>
          </div>
          <div style={{ fontSize:14, color:me?.color || INDIGO, fontWeight:700 }}>
            {myBadges.filter(b => b.earned).length * 250} XP from badges
          </div>
        </Card>
        <div className="grid4">
          {myBadges.map((b, i) => <div key={i} style={{ padding:"22px 14px", borderRadius:18, textAlign:"center", position:"relative",
            background: b.earned ? T.card : T.sub, opacity: b.earned ? 1 : .38,
            border:`${b.earned ? 2 : 1}px solid ${b.earned ? (me?.color || INDIGO) + "44" : T.line}`,
            boxShadow: b.earned ? `0 4px 16px ${(me?.color || INDIGO)}18` : "none" }}>
            <div style={{ fontSize:46, marginBottom:9, filter: b.earned ? "none" : "grayscale(1)", lineHeight:1 }}>{b.icon}</div>
            <div style={{ fontSize:13, fontWeight:800, color: b.earned ? T.text : T.muted, marginBottom:4 }}>{b.name}</div>
            <div style={{ fontSize:11, color:T.muted, lineHeight:1.45 }}>{b.desc}</div>
            {b.earned && <div style={{ position:"absolute", top:8, right:8, fontSize:9, background:me?.color || GREEN,
              color:"#fff", padding:"3px 8px", borderRadius:6, fontWeight:800 }}>+250</div>}
          </div>)}
        </div>
      </div>}

      {/* ══════ BREAKDOWN ══════ */}
      {tab === "breakdown" && <div style={{ animation:"rise .35s" }}>
        {!mySales.length
          ? <Card T={T}><div style={{ textAlign:"center", padding:"36px 0", color:T.muted }}>
              <div style={{ fontSize:44, marginBottom:10 }}>📭</div>
              <div style={{ fontSize:15, fontWeight:700 }}>Nothing to break down yet for this folio.</div>
            </div></Card>
          : <>
            {[{ title:"Premium by product type", data: mySales.reduce((a, s) => ({ ...a, [s.type]: (a[s.type] || 0) + s.price }), {}), fmt: money },
              { title:"Policies by carrier", data: mySales.reduce((a, s) => ({ ...a, [s.platform]: (a[s.platform] || 0) + 1 }), {}), fmt: v => v + (v === 1 ? " policy" : " policies") }
            ].map((sec, si) => {
              const entries = Object.entries(sec.data).sort((a, b) => b[1] - a[1]);
              return <Card key={si} T={T} style={{ marginBottom:14 }}>
                <SectionTitle T={T}>{sec.title}</SectionTitle>
                <HBars T={T} fmt={sec.fmt} max={Math.max(...entries.map(e => e[1]), 1)}
                  items={entries.map(([k, v], i) => ({ label:k, value:v, color:PALETTE[i % PALETTE.length] }))}/>
              </Card>;
            })}
            <Card T={T}>
              <SectionTitle T={T}>🏆 Biggest deals</SectionTitle>
              {[...mySales].sort((a, b) => b.price - a.price).slice(0, 10).map((s, i) =>
                <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 13px", borderRadius:12, marginBottom:6,
                  background: i === 0 ? "#fffbeb" : T.sub, border:`1px solid ${i === 0 ? "#fde68a" : T.line}` }}>
                  <div style={{ width:28, height:28, borderRadius:9, display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:13, fontWeight:800, color: i < 3 ? "#fff" : T.muted,
                    background: i === 0 ? AMBER : i === 1 ? "#94a3b8" : i === 2 ? "#b45309" : T.card }}>{i+1}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700 }}>{s.name}</div>
                    <div style={{ fontSize:10, color:T.muted }}>{s.type} · {s.platform} · {s.boundDate}</div>
                  </div>
                  <div style={{ fontSize:16, fontWeight:800, color: i === 0 ? "#b45309" : T.text }}>{money(s.price)}</div>
                </div>)}
            </Card>
          </>}
      </div>}

      {/* ══════ REVIEWS ══════ */}
      {tab === "reviews" && <div style={{ animation:"rise .35s" }}>
        <div className="grid4" style={{ marginBottom:16 }}>
          {producers.map(p => {
            const n = p.sales.filter(s => s.review).length, l = splitLines(p.sales);
            return <Card key={p.id} T={T} style={{ textAlign:"center" }}>
              <div style={{ fontSize:29, marginBottom:5 }}>{p.avatar}</div>
              <div style={{ fontSize:13, fontWeight:800, color:p.color, marginBottom:7 }}>{firstName(p.name)}</div>
              <div className="display" style={{ fontSize:24, color:GREEN }}>{short(p.premium)}</div>
              <div style={{ fontSize:11, color:T.muted, marginBottom:8 }}>{p.policies} policies</div>
              <div style={{ display:"flex", justifyContent:"center", gap:9, fontSize:11, color:T.muted, marginBottom:9 }}>
                <span>🏠{l.personal.count}</span><span>❤️{l.life.count}</span><span>🏢{l.commercial.count}</span>
              </div>
              <div className="display" style={{ fontSize:24 }}>⭐ {n}</div>
            </Card>;
          })}
        </div>
        <Card T={T}>
          <SectionTitle T={T}>All reviews ({reviews.length})</SectionTitle>
          {!reviews.length
            ? <div style={{ textAlign:"center", padding:"34px 0", color:T.muted }}>
                <div style={{ fontSize:40, marginBottom:9 }}>💬</div>
                <div style={{ fontSize:14, fontWeight:600 }}>No reviews in this folio yet.</div>
                <div style={{ fontSize:12, marginTop:5 }}>Anything typed in a sheet's Reviews column shows up here.</div>
              </div>
            : reviews.map((r, i) => <div key={i} style={{ padding:"14px 16px", borderRadius:14, marginBottom:9, background:T.sub, border:`1px solid ${T.line}` }}>
                <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:8 }}>
                  <span style={{ fontSize:21 }}>{r.avatar}</span>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:r.color }}>{r.who}</div>
                    <div style={{ fontSize:11, color:T.muted }}>{r.name} · {r.type} · {money(r.price)} · {r.boundDate}</div>
                  </div>
                  <span style={{ fontSize:17 }}>⭐</span>
                </div>
                <div style={{ fontSize:13, color:T.text2, fontStyle:"italic", lineHeight:1.6, paddingLeft:32 }}>“{r.review}”</div>
              </div>)}
        </Card>
      </div>}

      {/* ══════ ADMIN ══════ */}
      {tab === "admin" && admin && <div style={{ animation:"rise .35s" }}>
        <Card T={T} style={{ marginBottom:14, display:"flex", alignItems:"center", gap:11, flexWrap:"wrap",
          background: adminLeft < 60 ? "#fef2f2" : GREEN + "0b", borderColor: adminLeft < 60 ? "#fecaca" : GREEN + "44" }}>
          <span style={{ fontSize:20 }}>{adminLeft < 60 ? "⚠️" : "🔓"}</span>
          <div style={{ flex:1, minWidth:180 }}>
            <div style={{ fontSize:13, fontWeight:800, color: adminLeft < 60 ? RED : GREEN }}>
              Admin unlocked — {Math.floor(adminLeft/60)}:{String(adminLeft % 60).padStart(2,"0")} left
            </div>
            <div style={{ fontSize:11, color:T.muted }}>Re-locks automatically.</div>
          </div>
          <button onClick={unlockAdmin} style={btn(T, adminLeft < 60 ? "danger" : "go")}>Extend 5 min</button>
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T}>Quick actions</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
            {[["👥 Manage producers","producers",INDIGO],["📅 Contest periods","periods",GREEN],
              ["🎯 Team goals","teamGoals",AMBER],["📋 Message board","messages","#0891b2"]].map(([label, key, c]) =>
              <button key={key} onClick={() => setModal(key)} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
                fontSize:13, fontWeight:700, border:`1px solid ${c}44`, background:c + "0d", color:c }}>{label}</button>)}
          </div>
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T} right={<button onClick={refresh} disabled={busy} style={btn(T,"primary")}>{busy ? "Syncing…" : "Re-sync now"}</button>}>
            Sheet connections
          </SectionTitle>
          <div className="grid2">
            {raw.map(p => {
              const ok = p.allSales.length > 0;
              return <div key={p.id} style={{ padding:"13px 15px", borderRadius:13,
                background: ok ? GREEN + "0b" : "#fff7ed", border:`1px solid ${ok ? GREEN + "44" : "#fed7aa"}` }}>
                <div style={{ fontSize:14, fontWeight:800 }}>{p.avatar} <span style={{ color:p.color }}>{p.name}</span></div>
                <div style={{ fontSize:13, fontWeight:800, color: ok ? GREEN : "#c2410c", margin:"5px 0" }}>
                  {ok ? `${p.allSales.length} policies all-time · ${inPeriod(p.allSales, period).length} this folio` : "No data reaching the dashboard"}
                </div>
                <div style={{ fontSize:10, color:T.muted, wordBreak:"break-all" }}>gid {p.gid || "0"} · {p.sheetId ? p.sheetId.slice(0, 22) + "…" : "no sheet ID"}</div>
                {p.sheetId && <a href={csvByGid(p.sheetId, p.gid || 0)} target="_blank" rel="noreferrer"
                  style={{ fontSize:11, color:INDIGO, fontWeight:700, display:"inline-block", marginTop:6 }}>Test CSV feed ↗</a>}
              </div>;
            })}
          </div>
          <div style={{ marginTop:14, padding:"11px 14px", borderRadius:11, background:T.sub, fontSize:11, color:T.text2, lineHeight:1.6 }}>
            A sheet must be shared <b>Anyone with the link → Viewer</b> for the dashboard to read it. If Test CSV feed shows a
            sign-in page in a private window, that's the fix — not the code.
          </div>
        </Card>

        <Card T={T}>
          <SectionTitle T={T} right={<button onClick={() => setLog([])} style={{ ...btn(T), padding:"6px 12px", fontSize:11 }}>Clear</button>}>
            Sync log
          </SectionTitle>
          <div style={{ fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace", fontSize:11, maxHeight:300, overflow:"auto",
            background:T.sub, borderRadius:11, padding:"11px 13px" }}>
            {!log.length && <div style={{ color:T.muted, fontStyle:"italic" }}>Nothing logged yet. Hit Re-sync now.</div>}
            {log.map(l => <div key={l.id} style={{ padding:"3px 7px", borderRadius:5, marginBottom:2,
              background: l.kind === "ok" ? GREEN + "14" : l.kind === "err" ? RED + "12" : l.kind === "warn" ? AMBER + "14" : "transparent",
              color: l.kind === "ok" ? GREEN : l.kind === "err" ? RED : l.kind === "warn" ? "#b45309" : T.text2 }}>
              <span style={{ opacity:.6 }}>{l.time}</span> {l.msg}
            </div>)}
          </div>
        </Card>
      </div>}

      {/* ── Footer ── */}
      <footer style={{ marginTop:24, padding:"14px 18px", borderRadius:14, background:T.card, border:`1px solid ${T.border}`,
        display:"flex", justifyContent:"space-between", gap:9, flexWrap:"wrap", fontSize:11, color:T.muted }}>
        <span>{producers.length} producers · {money(teamPremium)} · {teamPolicies} policies</span>
        <span>{period?.name || "All time"} · {me?.name} · rank #{myRank || "—"}</span>
        <span style={{ color:INDIGO, fontWeight:700 }}>{CONFIG.app} v{CONFIG.version}</span>
      </footer>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
