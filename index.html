function App() {
  /* ── State ─────────────────────────────────────────────────────────── */
  const [dark, setDark] = useState(() => load("dark", false));
  const [producersCfg, setProducersCfg] = useState(() => {
    // Self-healing: pinned sheet IDs from source always win over cached config.
    // Seeds the four originals on a fresh browser only. Once the backend has
    // answered even once, its roster is the truth — otherwise a producer you
    // removed would be seeded straight back in on the next load.
    let cfg = load("producers", null);
    if (!Array.isArray(cfg)) cfg = DEFAULT_PRODUCERS;
    cfg = cfg.map(p => {
      const id = p.id === "stephanie" ? "aja" : p.id;
      return { ...p, id, name: p.id === "stephanie" ? "A'ja" : p.name,
        sheetId: SHEET_IDS[id] || p.sheetId || "", goals: { ...DEFAULT_GOALS, ...(p.goals || {}) } };
    });
    save("producers", cfg);
    return cfg;
  });
  const [periods, setPeriods] = useState(() => load("periods", DEFAULT_PERIODS));
  const [periodIdx, setPeriodIdx] = useState(() => currentPeriodIndex(load("periods", DEFAULT_PERIODS)));
  const [pinnedPeriod, setPinnedPeriod] = useState(false);
  const [teamGoals, setTeamGoals] = useState(() => load("teamGoals", DEFAULT_TEAM_GOALS));
  const [messages, setMessages] = useState(() => load("messages", []));
  const [meId, setMeId] = useState(() => load("meId", null));

  const [raw, setRaw] = useState([]);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [log, setLog] = useState([]);
  const [ctm, setCtm] = useState(null);

  const [tab, setTab] = useState("dashboard");
  const [whoId, setWhoId] = useState(producersCfg[0]?.id || "joey");
  // Until someone picks a producer, the view follows the top earner. Clicking
  // a tab pins it for the rest of the session; a refresh returns to the leader.
  const pickedProducer = useRef(false);
  const chooseProducer = useCallback(id => { pickedProducer.current = true; setWhoId(id); }, []);
  const [trendMode, setTrendMode] = useState("weekly");

  const [modal, setModal] = useState(null);
  const [admin, setAdmin] = useState(false);
  const [adminLeft, setAdminLeft] = useState(0);
  const [toast, setToast] = useState(null);
  const [cheer, setCheer] = useState(null);

  const T = dark ? DARK : LIGHT;
  const { canvasRef, launch } = useConfetti();
  /* The saved index came from whatever periods this browser last had. A new
     folio year, or a different list from the backend, can leave it pointing
     past the end — which used to mean no folio at all, and therefore all-time
     numbers. Fall back to the live folio instead. */
  const safeIdx = (periodIdx >= 0 && periodIdx < periods.length)
    ? periodIdx : Math.max(currentPeriodIndex(periods), 0);
  const period = periods[safeIdx];
  const isLivePeriod = safeIdx === currentPeriodIndex(periods);
  const locked = !admin && !!meId;

  const prevTotals = useRef({});
  const celebrated = useRef(new Set(load("celebrated", [])));
  const adminTimers = useRef({});

  /* ── Logging ───────────────────────────────────────────────────────── */
  const addLog = useCallback((msg, kind = "info") => {
    setLog(l => [{ id: Math.random(), time: new Date().toLocaleTimeString(), msg, kind }, ...l].slice(0, 60));
  }, []);

  /* ── Celebrations ──────────────────────────────────────────────────── */
  const celebrate = useCallback((key, title, icon, sub) => {
    const full = (period?.name || "all") + "|" + key;
    if (celebrated.current.has(full)) return;
    celebrated.current.add(full);
    save("celebrated", [...celebrated.current]);
    setCheer({ title, icon, sub });
    tone([392,523.25,659.25,783.99,1046.5,1318.5], "triangle", 0.24);
    launch();
    setTimeout(() => setCheer(null), 6500);
  }, [period, launch]);

  /* ── Cloud config ──────────────────────────────────────────────────
     The backend is the source of truth for the roster, so a producer added
     on one machine shows up for everyone without anyone editing this file. */
  const [cloud, setCloud] = useState({ state: hasBackend() ? "loading" : "off", error:"" });
  const [leads, setLeads] = useState(null);
  const [tplDraft, setTplDraft] = useState("");

  const pullLeadStatus = useCallback(async () => {
    if (!hasBackend()) return;
    const r = await api("leadStatus");
    setLeads(r.ok ? r : { error: r.error || "Lead sync is not responding. Check that the lead sync file is in the Apps Script project." });
  }, []);

  const pullConfig = useCallback(async () => {
    if (!hasBackend()) { setCloud({ state:"off", error:"" }); return null; }
    setCloud(c => ({ ...c, state:"loading" }));
    const r = await api("getConfig");
    if (!r.ok) { setCloud({ state:"error", error:r.error || "Backend unreachable." }); addLog("Backend: " + (r.error || "unreachable"), "warn"); return null; }

    // The backend is authoritative once it answers — including when it says the
    // roster is empty. Treating empty as "no news" made removals reappear on
    // the next refresh, because the cached copy won instead.
    if (Array.isArray(r.producers)) {
      const merged = r.producers.map(p => ({ ...p, goals:{ ...DEFAULT_GOALS, ...(p.goals || {}) } }));
      setProducersCfg(merged); save("producers", merged);
      save("rosterFromBackend", true);
      if (merged.length) setWhoId(w => merged.some(p => p.id === w) ? w : merged[0].id);
    }
    if (Array.isArray(r.periods) && r.periods.length) {
      setPeriods(r.periods); save("periods", r.periods);
      setPinnedPeriod(pin => { if (!pin) setPeriodIdx(currentPeriodIndex(r.periods)); return pin; });
    }
    if (r.teamGoals) { setTeamGoals(r.teamGoals); save("teamGoals", r.teamGoals); }

    setCloud({ state:"ok", error:"", build: r.build || "", templateId: r.templateId || "" });
    if (r.build && r.build !== EXPECTED_BUILD)
      addLog(`Deployment is serving build ${r.build}; this page expects ${EXPECTED_BUILD}. Redeploy a new version.`, "warn");
    addLog(`Backend connected — ${(r.producers || []).length} producers, ${(r.periods || []).length} folios`, "ok");
    return r;
  }, [addLog]);

  /* ── Fetch ─────────────────────────────────────────────────────────── */
  const syncAll = useCallback(async () => {
    addLog("Sync started", "info");
    const results = [];

    const snap = await fetchSnapshot(addLog);
    if (snap) {
      const byId = {};
      snap.forEach(x => { byId[x.id] = x; });
      for (const p of producersCfg) {
        const hit = byId[p.id] || snap.find(x => x.name === p.name);
        results.push({ ...p, allSales: hit ? salesFromSnapshot(hit.sales) : [] });
      }
    } else {
      for (const p of producersCfg) {
        const sales = await fetchProducerSales(p, periods, addLog);
        results.push({ ...p, allSales: sales });
      }
    }
    setRaw(results);
    setLastSync(new Date());
    setLoading(false);
    const total = results.reduce((a, r) => a + r.allSales.length, 0);
    addLog(total ? `Sync complete — ${total} policies across ${results.length} producers`
                 : "Sync complete — no policies found. Check sharing on each sheet.", total ? "ok" : "err");
  }, [producersCfg, periods, addLog]);

  const syncCtm = useCallback(async () => {
    if (!CONFIG.ctmUrl) return;
    try {
      const r = await fetch(CONFIG.ctmUrl, { redirect:"follow" });
      const d = JSON.parse(await r.text());
      setCtm(d.producers || d.ctm || d.data || null);
      addLog("CTM call data loaded", "ok");
    } catch (e) { addLog("CTM unreachable: " + e.message, "warn"); }
  }, [addLog]);

  useEffect(() => {
    (async () => { await pullConfig(); syncAll(); syncCtm(); pullLeadStatus(); })();
    /* eslint-disable-next-line */
  }, []);
  useEffect(() => { const t = setInterval(() => syncAll(), CONFIG.refreshMs); return () => clearInterval(t); }, [syncAll]);
  useEffect(() => {
    if (pinnedPeriod) return;
    const t = setInterval(() => setPeriodIdx(currentPeriodIndex(periods)), 60 * 60 * 1000);
    return () => clearInterval(t);
  }, [periods, pinnedPeriod]);

  const refresh = async () => {
    setBusy(true);
    await pullConfig();
    await Promise.all([syncAll(), syncCtm()]);
    setBusy(false);
  };

  /* ── Derived ───────────────────────────────────────────────────────── */
  const producers = useMemo(() => raw.map(p => {
    const sales = inPeriod(p.allSales, period);
    return { ...p, sales, premium: sales.reduce((a, s) => a + s.price, 0), policies: sales.length };
  }), [raw, period]);

  const teamPremium = producers.reduce((a, p) => a + p.premium, 0);
  const teamPolicies = producers.reduce((a, p) => a + p.policies, 0);
  const teamFarmers = farmersTotals(producers.flatMap(p => p.sales));
  const teamLines = splitLines(producers.flatMap(p => p.sales));
  const teamPolicyGoal = Number(teamGoals.personalLines||0) + Number(teamGoals.life||0) + Number(teamGoals.commercial||0);
  const ranked = [...producers].sort((a, b) => b.premium - a.premium);

  const me = producers.find(p => p.id === whoId) || producers[0];
  const mySales = me?.sales || [];
  const myLines = splitLines(mySales);
  const myFarmers = farmersTotals(mySales);
  const myBadges = earnedBadges(mySales);
  const myXP = calcXP(mySales);
  const myLevel = levelOf(myXP);
  const myRank = ranked.findIndex(p => p.id === whoId) + 1;
  const myCtm = ctm ? (ctm[me?.name] || ctm[firstName(me?.name)] || null) : null;
  const buckets = useMemo(() => bucketSales(me?.allSales || [], trendMode, periods), [me, trendMode, periods]);

  const reviews = producers.flatMap(p => p.sales.filter(s => s.review)
    .map(s => ({ ...s, who:p.name, avatar:p.avatar, color:p.color })));

  /* ── New-policy toast + goal celebrations ──────────────────────────── */
  useEffect(() => {
    if (loading || !producers.length) return;
    let fired = false;
    producers.forEach(p => {
      const before = prevTotals.current[p.id];
      if (before != null && p.policies > before && !fired) {
        const newest = p.sales[p.sales.length - 1];
        if (newest) { setToast({ ...newest, who:p.name }); playGong(); launch(); fired = true; }
      }
      prevTotals.current[p.id] = p.policies;
    });

    if (teamGoals.premium > 0 && teamPremium >= teamGoals.premium)
      celebrate("team-premium", "Team premium goal hit", "🏆", short(teamPremium) + " bound this period");
    if (teamPolicyGoal > 0 && teamPolicies >= teamPolicyGoal)
      celebrate("team-policies", "Team policy goal hit", "🎯", teamPolicies + " policies bound this period");
    producers.forEach(p => {
      const g = p.goals || {}, l = splitLines(p.sales);
      if (g.premium > 0 && p.premium >= g.premium) celebrate(p.id + "-prem", firstName(p.name) + " hit their premium goal", "💰", short(p.premium));
      if (g.policies > 0 && p.policies >= g.policies) celebrate(p.id + "-pol", firstName(p.name) + " hit their policy goal", "📋", p.policies + " policies");
      if (g.life > 0 && l.life.count >= g.life) celebrate(p.id + "-life", firstName(p.name) + " hit their life goal", "❤️", l.life.count + " life policies");
      if (g.commercial > 0 && l.commercial.count >= g.commercial) celebrate(p.id + "-comm", firstName(p.name) + " hit their commercial goal", "🏢", l.commercial.count + " commercial");
    });
  }, [producers, loading]); // eslint-disable-line

  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 9000); return () => clearTimeout(t); } }, [toast]);

  useEffect(() => {
    if (loading || pickedProducer.current || meId) return;
    const leader = [...producers].sort((a, b) => b.premium - a.premium)[0];
    if (leader && leader.premium > 0 && leader.id !== whoId) setWhoId(leader.id);
  }, [producers, loading, meId]); // eslint-disable-line

  /* ── Persistence helpers ───────────────────────────────────────────── */
  const persist = {
    producers: (v, opts) => {
      setProducersCfg(v); save("producers", v);
      if (!(opts && opts.silent)) api("saveProducers", { producers: v });
      setTimeout(() => syncAll(), 250);
    },
    periods:   v => { setPeriods(v); save("periods", v); api("savePeriods", { periods: v });
                      if (!pinnedPeriod) setPeriodIdx(currentPeriodIndex(v)); },
    teamGoals: v => { setTeamGoals(v); save("teamGoals", v); api("saveTeamGoals", { teamGoals: v }); },
    messages:  v => { setMessages(v); save("messages", v); },
    dark:      v => { setDark(v); save("dark", v); },
    meId:      v => { setMeId(v); save("meId", v); if (v) setWhoId(v); },
  };

  const unlockAdmin = () => {
    setAdmin(true); setAdminLeft(300);
    clearInterval(adminTimers.current.tick); clearTimeout(adminTimers.current.off);
    adminTimers.current.tick = setInterval(() => setAdminLeft(s => Math.max(0, s - 1)), 1000);
    adminTimers.current.off = setTimeout(() => {
      clearInterval(adminTimers.current.tick);
      setAdmin(false); setTab(t => t === "admin" ? "dashboard" : t);
    }, 300000);
  };
  useEffect(() => () => { clearInterval(adminTimers.current.tick); clearTimeout(adminTimers.current.off); }, []);

  const openGated = target => admin ? setModal(target) : setModal({ gate: target });

  /* ── Tabs ──────────────────────────────────────────────────────────── */
  const TABS = [
    { id:"dashboard",   label:"Dashboard",   icon:"📊" },
    { id:"goals",       label:"Goals",       icon:"🎯" },
    { id:"leaderboard", label:"Leaderboard", icon:"🏁" },
    { id:"trends",      label:"Trends",      icon:"📈" },
    { id:"team",        label:"Team KPIs",   icon:"📉" },
    { id:"badges",      label:"Badges",      icon:"🏆" },
    { id:"breakdown",   label:"Breakdown",   icon:"🧩" },
    { id:"reviews",     label:"Reviews",     icon:"⭐" },
    { id:"history",     label:"History",     icon:"🗓️" },
    ...(admin ? [{ id:"admin", label:"Admin", icon:"🔐" }] : []),
  ];

  const quote = QUOTES[(new Date().getFullYear()*366 + new Date().getMonth()*31 + new Date().getDate()) % QUOTES.length];

  /* ══════════════════════════════════════════════════════════════════ */
  return <div className="wrap" style={{ minHeight:"100vh", background:T.bg, color:T.text, padding:18 }}>
    <canvas ref={canvasRef} style={{ position:"fixed", inset:0, width:"100%", height:"100%", pointerEvents:"none", zIndex:8500 }}/>

    {/* Below the modal layer (9000) and hidden while one is open — at 9400 it
        covered the very dialog its own button opens, with no way back. */}
    {!loading && !producers.length && !modal && <div style={{ position:"fixed", inset:0, background:T.bg, zIndex:8200,
      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16, padding:24 }}>
      <img src={LOGO} alt="" style={{ height:64, width:"auto" }}/>
      <div className="display" style={{ fontSize:28 }}>No producers yet</div>
      <div style={{ fontSize:14, color:T.muted, textAlign:"center", maxWidth:420, lineHeight:1.7 }}>
        {hasBackend()
          ? "Open Admin and add your first producer. The tool will build their sales log, share it, and hand you the link."
          : "Set CONFIG.backendUrl to your Apps Script /exec URL first, then add producers here."}
      </div>
      <button onClick={() => admin ? setModal("producers") : setModal({ gate:"producers" })}
        style={{ ...btn(T,"go"), padding:"13px 26px", fontSize:14 }}>
        {admin ? "➕ Add a producer" : "🔐 Unlock admin to add one"}
      </button>
      <button onClick={refresh} disabled={busy}
        style={{ ...btn(T), padding:"9px 18px", fontSize:12 }}>
        {busy ? "Checking…" : "↻ Re-check the backend"}
      </button>
    </div>}

    {loading && <div style={{ position:"fixed", inset:0, background:T.bg, zIndex:9500, display:"flex",
      flexDirection:"column", alignItems:"center", justifyContent:"center", gap:14 }}>
      <img src={LOGO} alt="" style={{ height:70, width:"auto", animation:"pulse 1.8s ease-in-out infinite" }}/>
      <div className="display" style={{ fontSize:26 }}>Loading Battle Royale</div>
      <div style={{ fontSize:13, color:T.muted }}>Reading every folio tab across {producersCfg.length} sheets…</div>
    </div>}

    {cheer && <div style={{ position:"fixed", inset:0, zIndex:8600, display:"flex", alignItems:"center",
      justifyContent:"center", pointerEvents:"none", padding:20 }}>
      <div style={{ textAlign:"center", padding:"38px 54px", borderRadius:26, maxWidth:460,
        background:`linear-gradient(135deg,${NAVY},${INDIGO} 60%,#7c3aed)`, border:"3px solid rgba(255,255,255,.28)",
        boxShadow:"0 24px 80px rgba(0,0,0,.45)", animation:"popIn .45s cubic-bezier(.2,1.2,.4,1)" }}>
        <div style={{ fontSize:74, lineHeight:1, animation:"pulse 1s infinite" }}>{cheer.icon}</div>
        <div className="display" style={{ fontSize:34, color:"#fff", marginTop:8 }}>{cheer.title}</div>
        <div style={{ fontSize:15, color:"#c7d2fe", fontWeight:600, marginTop:4 }}>{cheer.sub}</div>
      </div>
    </div>}

    {toast && <div style={{ position:"fixed", top:18, left:"50%", zIndex:8700, animation:"toastIn .45s",
      background:T.card, borderRadius:16, padding:"15px 22px", display:"flex", gap:14, alignItems:"center",
      maxWidth:520, boxShadow:"0 12px 40px rgba(0,0,0,.22)", border:`1px solid ${T.border}` }}>
      <div style={{ fontSize:34 }}>🎉</div>
      <div style={{ flex:1 }}>
        <div style={{ fontSize:14, fontWeight:800 }}>New policy bound</div>
        <div style={{ fontSize:13, color:T.text2 }}>{toast.who} closed <b>{toast.name}</b> — <b style={{ color:GREEN }}>{money(toast.price)}</b></div>
      </div>
      <button onClick={() => setToast(null)} style={{ background:"none", border:"none", fontSize:20, cursor:"pointer", color:T.muted }}>×</button>
    </div>}

    {/* ── Modals ── */}
    {modal?.gate && <PasswordGate T={T} onClose={() => setModal(null)}
      onPass={() => { unlockAdmin(); setModal(modal.gate === "adminTab" ? null : modal.gate); if (modal.gate === "adminTab") setTab("admin"); }}/>}
    {modal === "producers" && <ProducersModal producers={producersCfg} T={T}
      onSave={persist.producers} onClose={() => setModal(null)}/>}
    {modal === "periods" && <PeriodsModal periods={periods} T={T} onSave={persist.periods} onClose={() => setModal(null)}/>}
    {modal === "newYear" && <NewYearModal T={T} periods={periods} producers={producersCfg}
      onClose={() => setModal(null)} onDone={list => { persist.producers(list, { silent:true }); setModal(null); }}
      addLog={addLog}/>}
    {modal === "teamGoals" && <TeamGoalsModal goals={teamGoals} T={T} onSave={persist.teamGoals} onClose={() => setModal(null)}/>}
    {modal === "messages" && <MessagesModal messages={messages} T={T} onSave={persist.messages} onClose={() => setModal(null)}/>}
    {modal === "avatar" && <PickerModal title="Choose your avatar" T={T} current={me?.avatar}
      options={AVATARS.map(a => ({ id:a, label:a }))} onClose={() => setModal(null)}
      onPick={a => persist.producers(producersCfg.map(p => p.id === whoId ? { ...p, avatar:a } : p))}/>}
    {modal === "sound" && <PickerModal title="🔊 Choose your victory sound" T={T} preview current={me?.sound}
      options={SOUNDS.map(s => ({ id:s.id, label:s.name }))} onClose={() => setModal(null)}
      onPick={s => persist.producers(producersCfg.map(p => p.id === whoId ? { ...p, sound:s } : p))}/>}
    {modal === "who" && <Modal onClose={() => setModal(null)} T={T} width={430}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontSize:36, marginBottom:8 }}>👤</div>
        <div className="display" style={{ fontSize:23, marginBottom:4 }}>Who's watching?</div>
        <p style={{ fontSize:12, color:T.muted, marginBottom:18 }}>Locks the dashboard to your own numbers. Team views stay open.</p>
        {producersCfg.map(p => <button key={p.id} onClick={() => { persist.meId(p.id); pickedProducer.current = true; setModal(null); }}
          style={{ display:"flex", alignItems:"center", gap:14, width:"100%", padding:"13px 17px", borderRadius:14,
            border:`1px solid ${T.border}`, background:T.sub, cursor:"pointer", marginBottom:8, color:T.text }}>
          <span style={{ fontSize:26 }}>{p.avatar}</span>
          <span style={{ flex:1, textAlign:"left", fontSize:14, fontWeight:700 }}>{p.name}</span>
          <span style={{ color:T.muted }}>→</span>
        </button>)}
        <button onClick={() => setModal(null)} style={{ ...btn(T), width:"100%", padding:11, marginTop:6 }}>Just browsing</button>
      </div>
    </Modal>}

    <div style={{ maxWidth:1240, margin:"0 auto" }}>

      {/* ── Header ── */}
      <header style={{ display:"flex", alignItems:"center", gap:14, marginBottom:14, flexWrap:"wrap" }}>
        <div style={{ width:56, height:56, borderRadius:15, flexShrink:0, display:"flex", alignItems:"center",
          justifyContent:"center", background: dark ? "#ffffff" : T.card,
          border:`1px solid ${T.border}`, boxShadow:"0 4px 14px rgba(15,23,42,.10)" }}>
          <img src={LOGO} alt="Young Douglas Insurance Services" style={{ height:38, width:"auto", display:"block" }}/>
        </div>
        <div style={{ flex:1, minWidth:180 }}>
          <div className="display" style={{ fontSize:27, lineHeight:1.05 }}>{CONFIG.app}</div>
          <div style={{ fontSize:11, color:T.muted, letterSpacing:1.6, textTransform:"uppercase", fontWeight:600 }}>
            {CONFIG.agency} · v{CONFIG.version}
          </div>
        </div>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", justifyContent:"flex-end" }}>
          <button onClick={() => persist.dark(!dark)} title="Toggle theme" style={{ ...btn(T), padding:"9px 12px" }}>{dark ? "☀️" : "🌙"}</button>
          <button onClick={() => openGated("messages")} style={{ ...btn(T), padding:"9px 12px" }}>📋 Board</button>
          <button onClick={() => admin ? setTab("admin") : setModal({ gate:"adminTab" })}
            style={{ ...btn(T), padding:"9px 12px", borderColor: admin ? INDIGO : T.border, color: admin ? INDIGO : T.text2 }}>
            {admin ? "🔓 Admin" : "🔐 Admin"}
          </button>
          <button onClick={refresh} disabled={busy} style={{ ...btn(T,"primary"), padding:"9px 14px", opacity: busy ? .6 : 1 }}>
            {busy ? "Syncing…" : "↻ Refresh"}
          </button>
        </div>
      </header>

      {/* ── Identity row ── */}
      <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:11, flexWrap:"wrap" }}>
        <div onClick={() => setModal("avatar")} title="Change avatar" style={{ width:52, height:52, borderRadius:15,
          cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontSize:26,
          background:`linear-gradient(135deg,${me?.color || INDIGO},${me?.color || INDIGO}bb)`,
          boxShadow:`0 5px 16px ${me?.color || INDIGO}44` }}>{me?.avatar || "👤"}</div>
        <div style={{ flex:1, minWidth:170 }}>
          <div style={{ fontSize:19, fontWeight:800 }}>{me?.name || "—"}</div>
          <div style={{ fontSize:12, color:T.muted, display:"flex", gap:9, flexWrap:"wrap" }}>
            <span>Rank #{myRank || "—"}</span><span>Level {myLevel.level}</span><span>{myXP.toLocaleString()} XP</span>
            {myCtm && <span>📞 {myCtm.answeredCalls || 0} calls</span>}
            {locked && <span style={{ background:GREEN+"1a", color:GREEN, padding:"1px 9px", borderRadius:6, fontWeight:700 }}>🔒 Your view</span>}
          </div>
        </div>
        {!admin && !meId && <button onClick={() => setModal("who")} style={{ ...btn(T,"primary"), padding:"8px 13px" }}>👤 Who am I?</button>}
        {meId && !admin && <button onClick={() => persist.meId(null)} style={{ ...btn(T), padding:"8px 12px", fontSize:11 }}>Switch</button>}
        <button onClick={() => setModal("sound")} title="Victory sound" style={{ ...btn(T), padding:"9px 12px" }}>🔊</button>
      </div>

              </div>
            </div>;
          })}
          {!ranked.length && <div style={{ fontSize:12, color:T.muted }}>No producers yet.</div>}
        </Card>
      </div>}

      {/* ══════ ADMIN ══════ */}
      {tab === "admin" && admin && <div style={{ animation:"rise .35s" }}>
        <Card T={T} style={{ marginBottom:14, display:"flex", alignItems:"center", gap:11, flexWrap:"wrap",
          background: adminLeft < 60 ? "#fef2f2" : GREEN + "0b", borderColor: adminLeft < 60 ? "#fecaca" : GREEN + "44" }}>
          <span style={{ fontSize:20 }}>{adminLeft < 60 ? "⚠️" : "🔓"}</span>
          <div style={{ flex:1, minWidth:180 }}>
            <div style={{ fontSize:13, fontWeight:800, color: adminLeft < 60 ? RED : GREEN }}>
              Admin unlocked — {Math.floor(adminLeft/60)}:{String(adminLeft % 60).padStart(2,"0")} left
            </div>
            <div style={{ fontSize:11, color:T.muted }}>Re-locks automatically.</div>
          </div>
          <button onClick={unlockAdmin} style={btn(T, adminLeft < 60 ? "danger" : "go")}>Extend 5 min</button>
        </Card>

        <Card T={T} style={{ marginBottom:14,
          background: cloud.state === "ok" ? GREEN + "0a" : cloud.state === "error" ? RED + "0a" : T.card,
          borderColor: cloud.state === "ok" ? GREEN + "44" : cloud.state === "error" ? RED + "44" : T.border }}>
          <SectionTitle T={T} right={<button onClick={pullConfig} style={{ ...btn(T), padding:"6px 12px", fontSize:12 }}>Re-check</button>}>
            {cloud.state === "ok" ? "✅ Backend connected" : cloud.state === "loading" ? "⏳ Checking backend…"
              : cloud.state === "error" ? "⚠️ Backend not responding" : "⚙️ Backend not set up"}
          </SectionTitle>
          {cloud.state === "ok" && cloud.build && cloud.build !== EXPECTED_BUILD && <div style={{ padding:"11px 14px",
            borderRadius:11, background:"#fff7ed", border:"1px solid #fed7aa", fontSize:12,
            color:"#9a3412", lineHeight:1.7, marginBottom:10 }}>
            <b>The deployment is serving older code.</b> This page expects build {EXPECTED_BUILD}, the backend
            reports {cloud.build}. Newer features will fail with "Unknown action".<br/>
            Fix: Apps Script → Deploy → Manage deployments → ✏️ on the deployment whose URL matches
            CONFIG.backendUrl → Version: <b>New version</b> → Deploy.
          </div>}
          {cloud.state === "ok" && <div style={{ fontSize:12, color:T.text2, lineHeight:1.7 }}>
            The producer roster, folio periods, and team goals all live on the backend, so every browser
            sees the same setup. Adding a producer builds their sheet and shares it automatically —
            nothing here needs a file edit.
          </div>}
          {cloud.state === "error" && <div style={{ fontSize:12, color:T.text2, lineHeight:1.7 }}>
            <div style={{ color:RED, fontWeight:700, marginBottom:6 }}>{cloud.error}</div>
            Check the deployment is set to <b>Execute as: Me</b> and <b>Who has access: Anyone</b>. After
            changing either, deploy a new version — editing an existing deployment does not always take.
            The dashboard is still running on its last known setup.
          </div>}
          {cloud.state === "off" && <div style={{ fontSize:12, color:T.text2, lineHeight:1.7 }}>
            Paste your Apps Script <b>/exec</b> URL into <code>CONFIG.backendUrl</code> near the top of
            index.html. That is the only code edit anyone ever needs to make — after it, producers are
            added from this screen.
          </div>}
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T}>Producer sheet template</SectionTitle>
          <div style={{ fontSize:12, color:T.text2, lineHeight:1.7, marginBottom:12 }}>
            Point this at a spreadsheet you have laid out yourself and every new producer gets
            a copy of it — your colours, your dropdowns, your extra tabs. Leave it blank and
            the tool draws the sheets instead.
            <br/><br/>
            It needs a tab named <b>FOLIO TEMPLATE</b>, which is copied once per contest period
            and renamed to the folio dates. <b>Current Leads</b> and <b>Aged Leads</b> come across
            as they are. Header text has to stay exactly as it is — every column is matched by name.
          </div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:10 }}>
            <input value={tplDraft} onChange={e => setTplDraft(e.target.value)}
              placeholder={cloud.templateId || "Paste the template's link, or leave blank for none"}
              style={{ ...input(T), flex:1, minWidth:240, fontSize:12 }}/>
            <button onClick={async () => {
              setBusy(true);
              const r = await api("saveTemplate", { templateId: tplDraft.trim() });
              setBusy(false);
              if (r.ok) {
                setTplDraft("");
                addLog(r.cleared ? r.message : "Template saved. Checking it…", "ok");
                const c = r.check || await api("checkTemplate");
                addLog(c.ok ? "Template looks right — new producers will be copied from it."
                            : "Template has problems: " + (c.problems || [c.error]).join(" · "),
                       c.ok ? "ok" : "warn");
                await pullConfig();
              } else addLog(r.error || "Could not save that template.", "err");
            }} disabled={busy} style={{ ...btn(T,"go"), padding:"9px 18px", fontSize:12 }}>
              {busy ? "Checking…" : "Save template"}
            </button>
            <button onClick={async () => {
              const c = await api("checkTemplate");
              addLog(c.ok
                ? (c.usingTemplate === false ? "No template set — sheets are drawn by the tool."
                                             : "Template looks right.")
                : "Template has problems: " + (c.problems || [c.error]).join(" · "),
                c.ok ? "ok" : "warn");
            }} style={{ ...btn(T), padding:"9px 16px", fontSize:12 }}>Check it</button>
          </div>
          <div style={{ fontSize:11, color:T.muted }}>
            {cloud.templateId
              ? <>In use: <span style={{ fontFamily:"ui-monospace,Menlo,monospace" }}>{cloud.templateId}</span>
                  {" · "}<a href={`https://docs.google.com/spreadsheets/d/${cloud.templateId}/edit`}
                    target="_blank" rel="noreferrer" style={{ color:INDIGO, fontWeight:700 }}>Open it ↗</a></>
              : "No template set — the tool draws each sheet."}
          </div>
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T}>Folio year</SectionTitle>
          <div style={{ fontSize:12, color:T.text2, lineHeight:1.7, marginBottom:12 }}>
            Put the new dates into <b>Contest periods</b> first. Then add the tabs to
            everyone's existing sheets, or start a clean book if you would rather last
            year's figures came off the board.
          </div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
            <button onClick={async () => {
              setBusy(true);
              const r = await api("addNewFolios");
              setBusy(false);
              if (r.ok) {
                addLog(r.producersUpdated
                  ? `Added folio tabs for ${r.producersUpdated} producer(s): ${(r.added||[]).join(" · ")}`
                  : "Every producer already has a tab for each period.", "ok");
                if ((r.failed||[]).length) addLog("Could not reach: " + r.failed.join(" · "), "warn");
              } else addLog("Could not add folios: " + (r.error || "unknown"), "err");
              await refresh();
            }} disabled={busy} style={{ ...btn(T,"go"), padding:"11px 18px" }}>
              📅 Add the new folio tabs
            </button>

            <button onClick={() => setModal("newYear")}
              style={{ ...btn(T), padding:"11px 18px", borderColor:AMBER + "66", color:"#92400e", background:AMBER + "0d" }}>
              🗄️ Start a clean year…
            </button>
          </div>
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T}>Quick actions</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
            {[["👥 Manage producers","producers",INDIGO],["📅 Contest periods","periods",GREEN],
              ["🎯 Team goals","teamGoals",AMBER],["📋 Message board","messages","#0891b2"]].map(([label, key, c]) =>
              <button key={key} onClick={() => setModal(key)} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
                fontSize:13, fontWeight:700, border:`1px solid ${c}44`, background:c + "0d", color:c }}>{label}</button>)}
            <button onClick={async () => {
              if (!confirm("Put every assignment back where the lead's own dates say?\n\n" +
                  "Use this if a producer's whole back catalogue has landed on their " +
                  "Current Leads. Leads worked in this folio stay; the rest file to " +
                  "Aged Leads, which is where they belong.\n\n" +
                  "No spreadsheet is changed.")) return;
              setBusy(true);
              const r = await api("reseedAssign");
              setBusy(false);
              addLog(r.ok
                ? `${r.reseeded} assignment(s) put back. The sheets re-file on the next sync.`
                : (r.error || "Could not do that."), r.ok ? "ok" : "err");
            }} disabled={busy} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
              fontSize:13, fontWeight:700, border:`1px solid ${T.border}`, background:T.card, color:T.text2 }}>
              ↩️ {busy ? "Working…" : "Put assignments back"}
            </button>
            <button onClick={async () => {
              const who = prompt(
                "Bring a producer's older leads onto their Current Leads?\n\n" +
                "Open leads sitting in a past folio move to this one, as though assigned " +
                "today. Bound and closed business stays where it happened.\n\n" +
                "Type their name:");
              if (!who || !who.trim()) return;

              setBusy(true);
              const pre = await api("bringForward", { who: who.trim(), dryRun: "true" });
              setBusy(false);
              if (!pre.ok) { addLog(pre.error || "Could not check that.", "err"); return; }

              if (!pre.wouldMove) {
                addLog(`${who.trim()}: nothing to bring forward — ${pre.already} already current, ` +
                       `${pre.closed} bound or closed.`, "ok");
                return;
              }
              if (!confirm(`Move ${pre.wouldMove} open lead(s) onto their Current Leads?\n\n` +
                  (pre.clients || []).slice(0, 10).join(", ") +
                  ((pre.clients || []).length > 10 ? ", and more" : "") + "\n\n" +
                  `${pre.closed} bound or closed lead(s) stay in their own folio.`)) return;

              setBusy(true);
              const r2 = await api("bringForward", { who: who.trim() });
              setBusy(false);
              addLog(r2.ok
                ? `${r2.name}: ${r2.moved} lead(s) brought forward. They appear within a few minutes.`
                : (r2.error || "Could not move those leads."), r2.ok ? "ok" : "err");
            }} disabled={busy} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
              fontSize:13, fontWeight:700, border:`1px solid ${GREEN}55`, background:GREEN + "0d", color:GREEN }}>
              ⬆️ {busy ? "Working…" : "Bring older leads current"}
            </button>
            <button onClick={async () => {
              setBusy(true);
              const r = await api("diagnoseAll");
              setBusy(false);
              if (!r.ok) { addLog("Diagnosis failed: " + (r.error || "unknown"), "err"); return; }

              addLog("── Why leads may not be arriving ──", "ok");
              (r.producers || []).forEach(p => {
                const summary = `${p.name}: ${p.assigned} assigned · ` +
                  `${p.shouldBeCurrent} should be current (${p.onCurrent === null ? "?" : p.onCurrent} there) · ` +
                  `${p.shouldBeAged} should be aged (${p.onAged === null ? "?" : p.onAged} there)` +
                  (p.folioTabs !== undefined ? ` · ${p.folioTabs} folio tabs` : "");
                addLog(summary, p.problems.length ? "warn" : "ok");
                p.problems.forEach(x => addLog("    " + p.name + " — " + x, "err"));
              });

              const un = Object.keys(r.unmatched || {});
              if (un.length) {
                addLog("These ASSIGNED TO values reach nobody: " +
                  un.map(k => `"${k}" (${r.unmatched[k]})`).join(" · "), "err");
              }
            }} disabled={busy} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
              fontSize:13, fontWeight:700, border:`1px solid ${AMBER}55`, background:AMBER + "0d", color:"#92400e" }}>
              🩺 {busy ? "Checking…" : "Why aren't leads arriving?"}
            </button>
            <button title={"Builds any missing tab, brings layouts up to date, corrects total rows, " +
              "stamps policy ids, and clears strike-through that no longer applies. " +
              "Nothing is deleted."}
              onClick={async () => {
              setBusy(true);
              const r = await api("repairSheets");
              setBusy(false);
              const done = r.fixed || [];
              addLog(done.length ? "Repaired — " + done.join(" · ")
                : r.ok ? "Every producer sheet is already in good order."
                : "Repair failed: " + (r.error || "unknown"), r.ok ? "ok" : "err");
              if ((r.failed || []).length) addLog("Problems: " + r.failed.join(" · "), "warn");
              await refresh();
            }} disabled={busy} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
              fontSize:13, fontWeight:700, border:`1px solid ${T.border}`, background:T.card, color:T.text2 }}>
              🔧 {busy ? "Checking…" : "Repair producer sheets"}
            </button>
            <button onClick={async () => {
              setBusy(true);
              const r = await api("dedupeLeads");
              setBusy(false);
              addLog((r.cleaned || []).length ? "Cleaned: " + r.cleaned.join(" · ")
                : r.ok ? "No duplicate leads found."
                : "Clean-up failed: " + (r.error || "unknown"), r.ok ? "ok" : "err");
              if ((r.failed || []).length) addLog("Problems: " + r.failed.join(" · "), "warn");
              await refresh();
            }} disabled={busy} style={{ padding:"11px 18px", borderRadius:11, cursor:"pointer",
              fontSize:13, fontWeight:700, border:`1px solid ${AMBER}44`, background:AMBER + "0d", color:"#92400e" }}>
              🧹 {busy ? "Working…" : "Remove duplicate leads"}
            </button>
          </div>
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T} right={<div style={{ display:"flex", gap:8 }}>
            <button onClick={async () => { setBusy(true); const r = await api("syncLeads");
              addLog(r.ok ? `Lead sync: ${JSON.stringify(r.stats)}` : "Lead sync failed: " + r.error, r.ok ? "ok" : "err");
              await pullLeadStatus(); await refresh(); setBusy(false); }}
              disabled={busy} style={{ ...btn(T,"primary"), padding:"6px 12px", fontSize:12 }}>
              {busy ? "Working…" : "Sync leads now"}
            </button>
            <button onClick={pullLeadStatus} style={{ ...btn(T), padding:"6px 12px", fontSize:12 }}>Refresh</button>
          </div>}>
            Lead pipeline
          </SectionTitle>
          {!leads ? <div style={{ fontSize:12, color:T.muted }}>
            Not checked yet — press Refresh. If nothing comes back, the lead sync file may not be added to the Apps Script project.
          </div> : leads.error ? <div style={{ fontSize:12, color:RED, lineHeight:1.6 }}>
            {leads.error}
          </div> : <>
            <div className="grid3" style={{ marginBottom:12 }}>
              {[{ l:"Leads in master", v:leads.ctmRows, c:INDIGO },
                { l:"Unassigned", v:leads.unassigned, c: leads.unassigned ? AMBER : GREEN },
                { l:"Snapshot built", v: leads.snapshotAt ? new Date(leads.snapshotAt).toLocaleTimeString() : "never",
                  c: leads.snapshotAt ? GREEN : RED }].map((x, i) =>
                <div key={i} style={{ padding:"12px 14px", borderRadius:12, background:x.c + "0b", border:`1px solid ${x.c}33` }}>
                  <div style={{ fontSize:10, color:T.muted, letterSpacing:1, textTransform:"uppercase" }}>{x.l}</div>
                  <div className="display" style={{ fontSize:22, color:x.c }}>{x.v}</div>
                </div>)}
            </div>
            <div style={{ fontSize:12, fontWeight:700, color:T.muted, marginBottom:8 }}>LEADS PER PRODUCER</div>
            {(leads.producers || []).map((p, i) =>
              <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 12px",
                borderRadius:10, marginBottom:5, background:T.sub, border:`1px solid ${p.wired === false ? AMBER + "55" : T.line}` }}>
                <span style={{ fontSize:12, fontWeight:600 }}>
                  {p.wired === false ? "⚠️ " : "✓ "}{p.name}
                </span>
                <span style={{ fontSize:12, fontWeight:800, color: p.wired === false ? AMBER : (p.leads ? INDIGO : T.muted) }}>
                  {p.wired === false ? "no Current Leads tab yet" : `${p.leads} in Current Leads`}
                </span>
              </div>)}
            <div style={{ marginTop:10, display:"flex", gap:8, flexWrap:"wrap" }}>
              <button onClick={async () => { const r = await api("wireAgents");
                addLog(r.ok && r.result.ok ? `ASSIGNED TO dropdown updated: ${r.result.agents.join(", ")}`
                                           : "Could not update the dropdown: " + ((r.result && r.result.error) || r.error), r.ok ? "ok" : "err");
                await pullLeadStatus(); }}
                style={{ ...btn(T), padding:"6px 12px", fontSize:11 }}>
                Refresh the CTM agent list
              </button>
            </div>
            {!!leads.unassigned && <div style={{ marginTop:10, padding:"10px 13px", borderRadius:11,
              background:"#fff7ed", border:"1px solid #fed7aa", fontSize:12, color:"#9a3412", lineHeight:1.6 }}>
              <b>{leads.unassigned} lead{leads.unassigned === 1 ? "" : "s"} reaching nobody.</b> The name in
              ASSIGNED TO doesn't match a producer, so {leads.unassigned === 1 ? "it never lands" : "they never land"} in
              anyone's Current Leads. Usually a typo or someone no longer on the roster.
              <button onClick={async () => { const r = await api("auditAssign");
                if (r.ok) {
                  const lines = (r.unmatched || []).map(u => `${u.count}× "${u.typed}"` + (u.nearest ? ` — did you mean "${u.nearest}"?` : ""));
                  addLog(lines.length ? "Reaching nobody: " + lines.join(" · ") : "Every assigned lead has a home.", lines.length ? "warn" : "ok");
                } else addLog("Audit failed: " + (r.error || "unknown"), "err");
              }} style={{ ...btn(T), padding:"5px 11px", fontSize:11, marginLeft:8, background:"#fff", borderColor:"#fed7aa", color:"#9a3412" }}>
                Show which names
              </button>
            </div>}
          </>}
        </Card>

        <Card T={T} style={{ marginBottom:14 }}>
          <SectionTitle T={T} right={<button onClick={refresh} disabled={busy} style={btn(T,"primary")}>{busy ? "Syncing…" : "Re-sync now"}</button>}>
            Sheet connections
          </SectionTitle>
          <div className="grid2">
            {raw.map(p => {
              const ok = p.allSales.length > 0;
              return <div key={p.id} style={{ padding:"13px 15px", borderRadius:13,
                background: ok ? GREEN + "0b" : "#fff7ed", border:`1px solid ${ok ? GREEN + "44" : "#fed7aa"}` }}>
                <div style={{ fontSize:14, fontWeight:800 }}>{p.avatar} <span style={{ color:p.color }}>{p.name}</span></div>
                <div style={{ fontSize:13, fontWeight:800, color: ok ? GREEN : "#c2410c", margin:"5px 0" }}>
                  {ok ? `${p.allSales.length} policies all-time · ${inPeriod(p.allSales, period).length} this folio` : "No data reaching the dashboard"}
                </div>
                <div style={{ fontSize:10, color:T.muted, wordBreak:"break-all" }}>gid {p.gid || "0"} · {p.sheetId ? p.sheetId.slice(0, 22) + "…" : "no sheet ID"}</div>
                {p.sheetId && <a href={csvByGid(p.sheetId, p.gid || 0)} target="_blank" rel="noreferrer"
                  style={{ fontSize:11, color:INDIGO, fontWeight:700, display:"inline-block", marginTop:6 }}>Test CSV feed ↗</a>}
              </div>;
            })}
          </div>
          <div style={{ marginTop:14, padding:"11px 14px", borderRadius:11, background:T.sub, fontSize:11, color:T.text2, lineHeight:1.6 }}>
            A sheet must be shared <b>Anyone with the link → Viewer</b> for the dashboard to read it. If Test CSV feed shows a
            sign-in page in a private window, that's the fix — not the code.
          </div>
        </Card>

        <Card T={T}>
          <SectionTitle T={T} right={<button onClick={() => setLog([])} style={{ ...btn(T), padding:"6px 12px", fontSize:11 }}>Clear</button>}>
            Sync log
          </SectionTitle>
          <div style={{ fontFamily:"ui-monospace,SFMono-Regular,Menlo,monospace", fontSize:11, maxHeight:300, overflow:"auto",
            background:T.sub, borderRadius:11, padding:"11px 13px" }}>
            {!log.length && <div style={{ color:T.muted, fontStyle:"italic" }}>Nothing logged yet. Hit Re-sync now.</div>}
            {log.map(l => <div key={l.id} style={{ padding:"3px 7px", borderRadius:5, marginBottom:2,
              background: l.kind === "ok" ? GREEN + "14" : l.kind === "err" ? RED + "12" : l.kind === "warn" ? AMBER + "14" : "transparent",
              color: l.kind === "ok" ? GREEN : l.kind === "err" ? RED : l.kind === "warn" ? "#b45309" : T.text2 }}>
              <span style={{ opacity:.6 }}>{l.time}</span> {l.msg}
            </div>)}
          </div>
        </Card>
      </div>}

      {/* ── Footer ── */}
      <footer style={{ marginTop:24, padding:"14px 18px", borderRadius:14, background:T.card, border:`1px solid ${T.border}`,
        display:"flex", justifyContent:"space-between", gap:9, flexWrap:"wrap", fontSize:11, color:T.muted }}>
        <span>{producers.length} producers · {money(teamPremium)} · {teamPolicies} policies</span>
        <span>{period?.name || "All time"} · {me?.name} · rank #{myRank || "—"}</span>
        <span style={{ color:INDIGO, fontWeight:700 }}>{CONFIG.app} v{CONFIG.version}</span>
      </footer>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
