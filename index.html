.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/* Longest aliases first so "annualpremium" wins before bare "premium". */
const ALIASES = {
  name:          ["name","clientname","insuredname","customername","client","insured","customer"],
  price:         ["annualpremium","totalpremium","premiumamount","premium","price","amount","cost"],
  boundDate:     ["bounddate","datebound","binddate","dateclosed","closeddate","bound","sold"],
  effectiveDate: ["effectivedate","effdate","effective"],
  leadDate:      ["leaddate","datelead"],
  type:          ["typeofinsurance","policytype","insurancetype","linetype","coverage","product","type","line"],
  platform:      ["salesplatform","platform","carrier","company","provider"],
  policyNumber:  ["policynumber","policyno","polnum","policy"],
  leadSource:    ["leadsource","leadsrc","source"],
  status:        ["status"],
  review:        ["reviews","review","testimonial","feedback","rating"],
};

/* Maps each field to a real header from this sheet. Exact match first, then
   substring, so "Bound Date (Eff)" and "12 Month Premium" still land. */
function buildFieldMap(headers) {
  const map = {}, used = new Set();
  const pick = (field, test) => {
    if (map[field]) return;
    for (const alias of ALIASES[field]) {
      const hit = headers.find(h => !used.has(h) && test(norm(h), alias));
      if (hit) { map[field] = hit; used.add(hit); return; }
    }
  };
  Object.keys(ALIASES).forEach(f => pick(f, (h, a) => h === a));
  Object.keys(ALIASES).forEach(f => pick(f, (h, a) => a.length >= 4 && h.includes(a)));
  return map;
}

function toNumber(raw) {
  if (raw == null) return 0;
  let s = String(raw).trim();
  if (!s) return 0;
  const neg = /^\(.*\)$/.test(s);
  s = s.replace(/[()$,\s]/g, "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : (neg ? -n : n);
}

function toDate(raw) {
  if (raw == null) return null;
  const s = String(raw).trim();
  if (!s) return null;
  // Sheets serial number
  if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date((Number(s) - 25569) * 86400000); return isNaN(d) ? null : d; }
  // ISO date — build locally so it doesn't drift a day backwards in Pacific time
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  // M/D/YYYY
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1] - 1, +m[2]); }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

const fmtDate = d => d ? (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear() : "";

function categorize(type) {
  const t = String(type || "").toLowerCase();
  if (/life|annuity|term|final expense/.test(t)) return "life";
  if (/commercial|business|workers|bop|liability|restaurant|habitational|contractor|garage|fleet/.test(t)) return "commercial";
  return "personal";
}

function parseSale(row, map) {
  const get = f => map[f] ? row[map[f]] : null;
  const bound = toDate(get("boundDate"));
  return {
    name: String(get("name") || "").trim() || "Unknown",
    status: String(get("status") || "Bound").trim(),
    price: toNumber(get("price")),
    boundDate: fmtDate(bound),
    boundOn: bound,
    effectiveDate: String(get("effectiveDate") || "").trim(),
    type: String(get("type") || "Other").trim() || "Other",
    platform: String(get("platform") || "Unknown").trim() || "Unknown",
    policyNumber: String(get("policyNumber") || "").trim(),
    leadSource: String(get("leadSource") || "").trim(),
    review: String(get("review") || "").trim(),
  };
}

   result, so the sheets themselves can stay private to the domain. CSV is kept
   as a fallback for when the backend is unreachable. */
async function fetchSnapshot(log) {
  if (!hasBackend()) return null;
  const r = await api("getSnapshot");
  if (!r.ok || !Array.isArray(r.snapshot)) {
    log("Snapshot unavailable — falling back to reading sheets directly", "warn");
    return null;
  }
  const total = r.snapshot.reduce((a, p) => a + (p.sales || []).length, 0);
  if (!total) {
    log("Snapshot is empty — falling back to reading sheets directly", "warn");
    return null;
  }
  const age = r.builtAt ? Math.round((Date.now() - new Date(r.builtAt)) / 60000) : null;
  log(`Snapshot loaded — ${total} policies${age != null ? `, built ${age} min ago` : ""}`, "ok");
  return r.snapshot;
}

function salesFromSnapshot(rows) {
  return (rows || []).map(s => {
    const bound = toDate(s.boundDate);
    return {
      name: String(s.name || "").trim() || "Unknown",
      status: String(s.status || "Bound").trim(),
      price: Number(s.price) || 0,
      folio: String(s.folio || "").trim(),      // the tab it was logged on
      boundDate: fmtDate(bound),
      boundOn: bound,
      effectiveDate: String(s.effectiveDate || "").trim(),
      type: String(s.type || "Other").trim() || "Other",
      platform: String(s.platform || "Unknown").trim() || "Unknown",
      policyNumber: String(s.policyNumber || "").trim(),
      leadSource: String(s.leadSource || "").trim(),
      review: String(s.review || "").trim(),
    };
  }).filter(s => s.name && s.price > 0);
}

async function fetchProducerSales(producer, periods, log) {
  const id = producer.sheetId;
  if (!id) { log(`${producer.name}: no sheet ID set`, "warn"); return []; }

  const seen = new Set(), out = [];
  const note = (label, msg, kind) => log(`${producer.name} · ${label} — ${msg}`, kind);

  const readCsv = text => {
    if (!text || text.length < 20) return { rows: [], why: "empty response" };
    const head = text.trimStart().slice(0, 400).toLowerCase();
    if (head.startsWith("<")) {
      return { rows: [], why: /signin|accounts\.google|sign in/.test(head)
        ? "sign-in page returned — this sheet is not shared with Anyone-with-link"
        : "HTML returned instead of CSV — tab missing, or sheet not shared" };
    }
    let parsed;
    try { parsed = Papa.parse(text, { header:true, skipEmptyLines:true, transformHeader: h => String(h || "").trim() }); }
    catch (e) { return { rows: [], why: "CSV parse failed: " + e.message }; }

    const headers = (parsed.meta && parsed.meta.fields) || [];

    // The lead pipeline is not production. Reject it on the Lead ID column so a
    // renamed tab cannot slip quoted premiums onto the leaderboard.
    if (headers.some(h => /^\s*lead\s*id\s*$/i.test(h)))
      return { rows: [], why: "lead pipeline tab — skipped, not production data" };

    const map = buildFieldMap(headers);
    if (!map.name || !map.price) {
      return { rows: [], why: `no ${!map.name ? "name" : "price"} column found. Headers: [${headers.join(" | ")}]` };
    }
    const rows = (parsed.data || []).map(r => parseSale(r, map))
      .filter(s => s.name && norm(s.name) !== "name" && s.price > 0);
    if (!rows.length && (parsed.data || []).length) {
      return { rows: [], why: `${parsed.data.length} rows read, none usable (need a name and a price above $0)` };
    }
    return { rows, why: "" };
  };

  const attempt = async (url, label, folio) => {
    let res;
    try { res = await fetch(url, { redirect:"follow", cache:"no-store" }); }
    catch (e) { note(label, "blocked by CORS or network: " + e.message, "err"); return []; }
    if (!res.ok) { note(label, "HTTP " + res.status, "err"); return []; }
    let text = "";
    try { text = await res.text(); } catch (e) { note(label, "could not read body", "err"); return []; }
    const { rows, why } = readCsv(text);
    if (why) note(label, why, "warn");
    // Fetched by tab name, so we know which folio these belong to. Rows found
    // by gid have no folio and fall back to their bound date.
    if (folio) rows.forEach(r => { r.folio = folio; });
    return rows;
  };

  const absorb = (rows, label) => {
    let added = 0;
    rows.forEach(r => {
      const key = `${norm(r.name)}|${r.boundDate}|${r.price}|${norm(r.policyNumber)}`;
      if (!seen.has(key)) { seen.add(key); out.push(r); added++; }
    });
    if (added) note(label, `+${added} policies`, "ok");
  };

  // Every place a folio tab might be hiding, in order of likelihood.
  const jobs = [
    { url: csvByGid(id, producer.gid || "0"), label: `gid ${producer.gid || 0}` },
    { url: csvFirst(id), label: "first tab" },
    // "first tab" may now be Current Leads. readCsv rejects it on the Lead ID
    // column, so a quoted premium can never be scored as a bound policy.
    // Tab names come in two shapes: the display name and the slash-stripped
    // version the sheet template uses ("7/18-8/19/2026" -> "718-8192026").
    ...periods.flatMap(p => {
      const bare = p.name.replace(/[\/\\\[\]\*\?:]/g, "");
      const names = bare === p.name ? [p.name] : [p.name, bare];
      return names.map(n => ({ url: csvByName(id, n), label: `tab "${n}"`, folio: p.name }));
    }),
    ...["0","1","2","3","4","5"].filter(g => g !== String(producer.gid))
        .map(g => ({ url: csvByGid(id, g), label: `gid ${g}` })),
  ];

  for (let i = 0; i < jobs.length; i += 5) {
    const batch = jobs.slice(i, i + 5);
    const results = await Promise.all(batch.map(j => attempt(j.url, j.label, j.folio)));
    results.forEach((rows, n) => absorb(rows, batch[n].label));
  }

  log(`${producer.name}: ${out.length} policies loaded`, out.length ? "ok" : "err");
  return out;
}

/* ── Backend API ──────────────────────────────────────────────────────
   Posted as text/plain so the browser treats it as a simple request and
   skips the CORS preflight that Apps Script cannot answer. */

const hasBackend = () => /^https:\/\//.test(CONFIG.backendUrl || "");

/* Must match BACKEND_BUILD in ydi-backend.gs. A mismatch means the deployment
   is serving an older version of the script than this page expects. */
const EXPECTED_BUILD = "16.4";

async function api(action, payload = {}) {
  if (!hasBackend()) return { ok:false, error:"No backend URL is set in CONFIG yet." };
  try {
    const res = await fetch(CONFIG.backendUrl, {
      method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...payload }),
    });
    const text = await res.text();
    try { return JSON.parse(text.replace(/^\uFEFF/, "").trim()); }
    catch (e) {
      const m = text.match(/\{[\s\S]*\}/);
      if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
      return { ok:false, error:"The backend replied with something unreadable. Check it is deployed with access set to Anyone." };
    }
  } catch (e) {
    return { ok:false, error:"Could not reach the backend: " + e.message };
  }
}

function currentPeriodIndex(periods) {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  for (let i = 0; i < periods.length; i++) {
    const s = new Date(periods[i].start + "T00:00:00"), e = new Date(periods[i].end + "T23:59:59");
    if (today >= s && today <= e) return i;
  }
  let last = 0;
  periods.forEach((p, i) => { if (today > new Date(p.end + "T23:59:59")) last = i; });
  return last;
}

/* Sales belonging to one folio.
   The tab a policy is logged on decides its folio — a row on the February tab
   is February's business whatever date sits in its bound column. Only rows with
   no tab recorded fall back to the date, which is the older CSV path.
   With no folio at all this returns nothing, not everything: it used to return
   every sale ever, so while the folio selection was resolving the tiles showed
   all-time totals. */
function inPeriod(sales, period) {
  if (!period) return [];
  const s = new Date(period.start + "T00:00:00"), e = new Date(period.end + "T23:59:59");
  return sales.filter(x => {
    if (x.folio) return x.folio === period.name;
    return x.boundOn && x.boundOn >= s && x.boundOn <= e;
  });
}

/* Written with Farmers rather than a broker.
   Bristol West is a Farmers company and counts; the wider broker panel does
   not. Matched on the Sales platform column, so whatever an agent picked from
   the carrier dropdown decides it. */
const FARMERS_CARRIERS = /^(farmers|bristol\s*west)/i;

function isFarmers(sale) {
  return FARMERS_CARRIERS.test(String(sale.platform || "").trim());
}

function farmersTotals(sales) {
  const only = (sales || []).filter(isFarmers);
  return { count: only.length, premium: only.reduce((a, s) => a + s.price, 0), sales: only };
}

function splitLines(sales) {
  const out = { personal:{ count:0, premium:0 }, life:{ count:0, premium:0 }, commercial:{ count:0, premium:0 } };
  sales.forEach(s => { const c = categorize(s.type); out[c].count++; out[c].premium += s.price; });
  return out;
}

const BADGES = [
  { name:"First Blood",         desc:"Bind your first policy",     icon:"🎯",  test:s => s.length >= 1 },
  { name:"High Roller",         desc:"A single $5K policy",        icon:"💰",  test:s => s.some(x => x.price >= 5000) },
  { name:"Whale Hunter",        desc:"A single $10K policy",       icon:"🐋",  test:s => s.some(x => x.price >= 10000) },
  { name:"Double Digits",       desc:"10 policies bound",          icon:"🔟",  test:s => s.length >= 10 },
  { name:"Twenty Club",         desc:"20 policies bound",          icon:"📦",  test:s => s.length >= 20 },
  { name:"Diversified",         desc:"5 different product types",  icon:"🎨",  test:s => new Set(s.map(x => x.type)).size >= 5 },
  { name:"Platform Master",     desc:"5 different carriers",       icon:"🌐",  test:s => new Set(s.map(x => x.platform)).size >= 5 },
  { name:"Life Saver",          desc:"3 life policies",            icon:"❤️",  test:s => s.filter(x => categorize(x.type) === "life").length >= 3 },
  { name:"Life Legend",         desc:"8 life policies",            icon:"💗",  test:s => s.filter(x => categorize(x.type) === "life").length >= 8 },
  { name:"Commercial Crusher",  desc:"First commercial policy",    icon:"🏢",  test:s => s.some(x => categorize(x.type) === "commercial") },
  { name:"Commercial King",     desc:"5 commercial policies",      icon:"🏙️",  test:s => s.filter(x => categorize(x.type) === "commercial").length >= 5 },
  { name:"Safety First",        desc:"A workers comp policy",      icon:"🦺",  test:s => s.some(x => /workers/i.test(x.type)) },
  { name:"Well Reviewed",       desc:"3 customer reviews",         icon:"⭐",  test:s => s.filter(x => x.review).length >= 3 },
  { name:"$25K Club",           desc:"$25,000 in premium",         icon:"💵",  test:s => s.reduce((a,x) => a + x.price, 0) >= 25000 },
  { name:"$50K Club",           desc:"$50,000 in premium",         icon:"🔥",  test:s => s.reduce((a,x) => a + x.price, 0) >= 50000 },
  { name:"Back to Back",        desc:"Sales in 2 calendar months", icon:"📅",  test:s => new Set(s.filter(x => x.boundOn).map(x => x.boundOn.getMonth())).size >= 2 },
];

const earnedBadges = sales => BADGES.map(b => ({ ...b, earned: b.test(sales) }));

const LEVELS = [0,1000,2500,4500,7000,10000,14000,19000,25000,35000];

function calcXP(sales) {
  let xp = 0;
  sales.forEach(s => {
    xp += 100;
    if (s.price >= 5000) xp += 200;
    if (s.price >= 10000) xp += 300;
    const c = categorize(s.type);
    if (c === "commercial") xp += 100;
    if (c === "life") xp += 120;
    if (s.review) xp += 75;
  });
  xp += earnedBadges(sales).filter(b => b.earned).length * 250;
  return xp;
}

function levelOf(xp) {
  let lvl = 1, floor = 0, next = LEVELS[1];
  for (let i = 0; i < LEVELS.length; i++) {
    if (xp >= LEVELS[i]) { lvl = i + 1; floor = LEVELS[i]; next = LEVELS[i + 1] ?? null; }
  }
  return { level: lvl, floor, next };
}

function bucketSales(sales, mode, periods) {
  const now = new Date(); now.setHours(23, 59, 59, 999);
  const make = (label, from, to) => {
    const rows = sales.filter(s => s.boundOn && s.boundOn >= from && s.boundOn <= to);
    const l = splitLines(rows);
    return { label, premium: rows.reduce((a, x) => a + x.price, 0), policies: rows.length,
             life: l.life.count, commercial: l.commercial.count, personal: l.personal.count };
  };
  if (mode === "daily") {
    return Array.from({ length: 28 }, (_, i) => {
      const d = new Date(now); d.setDate(d.getDate() - (27 - i));
      const from = new Date(d); from.setHours(0,0,0,0);
      const to = new Date(d); to.setHours(23,59,59,999);
      return make(`${d.getMonth()+1}/${d.getDate()}`, from, to);
    });
  }
  if (mode === "period") {
    return periods.map(p => make(p.name.split("-")[0],
      new Date(p.start + "T00:00:00"), new Date(p.end + "T23:59:59")))
      .filter(b => b.premium > 0 || b.policies > 0);
  }
  if (mode === "yearly") {
    const y = now.getFullYear();
    const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return names.map((nm, m) => make(nm, new Date(y, m, 1), new Date(y, m + 1, 0, 23, 59, 59)));
  }
  return Array.from({ length: 8 }, (_, i) => {
    const to = new Date(now); to.setDate(to.getDate() - ((7 - i) * 7));
    const from = new Date(to); from.setDate(from.getDate() - 6); from.setHours(0,0,0,0);
    return make(`${from.getMonth()+1}/${from.getDate()}`, from, to);
  });
}

function trendOf(buckets, field) {
  if (buckets.length < 2) return { arrow:"→", pct:0, color:"#94a3b8" };
  const cur = buckets[buckets.length-1][field], prev = buckets[buckets.length-2][field];
  if (!prev) return cur > 0 ? { arrow:"↑", pct:100, color:GREEN } : { arrow:"→", pct:0, color:"#94a3b8" };
  const change = ((cur - prev) / prev) * 100;
  if (change > 0) return { arrow:"↑", pct:Math.round(change), color:GREEN };
  if (change < 0) return { arrow:"↓", pct:Math.round(-change), color:RED };
  return { arrow:"→", pct:0, color:"#94a3b8" };
}

/* ══════════════════════════════════════════════════════════════════════
   7. SOUND + CONFETTI
   ══════════════════════════════════════════════════════════════════════ */

function tone(notes, type = "sine", gain = 0.16) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = type; o.frequency.value = f;
      const at = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(gain, at);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.42);
      o.start(at); o.stop(at + 0.45);
    });
  } catch (e) {}
}

const playSound = id => { const s = SOUNDS.find(x => x.id === id) || SOUNDS[0]; tone(s.notes); };

function playGong() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ctx.currentTime;
    [[80,1.1,3.4],[160,.55,2.7],[240,.32,2.1],[320,.18,1.7],[480,.1,1.4]].forEach(([f, g, decay]) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.connect(gn); gn.connect(ctx.destination);
      o.type = f < 200 ? "sine" : "triangle";
      o.frequency.setValueAtTime(f * 1.06, t0);
      o.frequency.exponentialRampToValueAtTime(f, t0 + 0.08);
      gn.gain.setValueAtTime(0, t0);
      gn.gain.linearRampToValueAtTime(g, t0 + 0.01);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + decay);
      o.start(t0); o.stop(t0 + decay + 0.1);
    });
  } catch (e) {}
}

function useConfetti() {
  const canvasRef = useRef(null), bits = useRef([]), frame = useRef(null);
  const launch = useCallback(() => {
    const cv = canvasRef.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    const colors = ["#6366f1","#ec4899","#f59e0b","#10b981","#ef4444","#8b5cf6","#06b6d4","#fbbf24"];
    const shapes = ["rect","circle","star"];
    const origins = [[cv.width/2, cv.height*.44], [cv.width*.18, cv.height*.5], [cv.width*.82, cv.height*.5]];
    for (let i = 0; i < 300; i++) {
      const [ox, oy] = origins[i % 3];
      const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 13;
      bits.current.push({ x: ox + (Math.random()-.5)*40, y: oy + (Math.random()-.5)*40,
        w: 5 + Math.random()*9, h: 4 + Math.random()*7,
        color: colors[i % colors.length], shape: shapes[i % 3],
        vx: Math.cos(a)*sp*(.6+Math.random()*.8), vy: Math.sin(a)*sp - 8 - Math.random()*5,
        rot: Math.random()*360, rs: (Math.random()-.5)*17, life: 1, decay: .006 + Math.random()*.006 });
    }
    const step = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      bits.current = bits.current.filter(b => b.life > 0);
      bits.current.forEach(b => {
        b.x += b.vx; b.vx *= .99; b.vy += .18; b.y += b.vy; b.rot += b.rs; b.life -= b.decay;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot * Math.PI/180);
        ctx.globalAlpha = Math.max(0, b.life); ctx.fillStyle = b.color;
        if (b.shape === "circle") { ctx.beginPath(); ctx.arc(0,0,b.w/2,0,Math.PI*2); ctx.fill(); }
        else if (b.shape === "star") {
          ctx.beginPath();
          for (let s = 0; s < 5; s++) {
            const o = s*Math.PI*2/5 - Math.PI/2, inn = (s+.5)*Math.PI*2/5 - Math.PI/2;
            ctx.lineTo(Math.cos(o)*b.w/2, Math.sin(o)*b.w/2);
            ctx.lineTo(Math.cos(inn)*b.w/4, Math.sin(inn)*b.w/4);
          }
          ctx.closePath(); ctx.fill();
        } else ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
        ctx.restore();
      });
      if (bits.current.length) frame.current = requestAnimationFrame(step);
    };
    if (frame.current) cancelAnimationFrame(frame.current);
    step();
  }, []);
  return { canvasRef, launch };
}

function Card({ children, T, pad = 18, style }) {
  return <div style={{ background:T.card, borderRadius:16, padding:pad, border:`1px solid ${T.border}`, boxShadow:T.shadow, ...style }}>{children}</div>;
}

function SectionTitle({ children, T, right }) {
  return <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
    <div className="display" style={{ fontSize:19, color:T.text }}>{children}</div>
    {right}
  </div>;
}

function Bar({ value, max, color, height = 22, T, label }) {
  const p = pctOf(value, max);
  return <div style={{ height, background:T.sub, borderRadius:height/2, overflow:"hidden", position:"relative" }}>
    <div style={{ width:`${Math.max(p, 1.5)}%`, height:"100%", background:`linear-gradient(90deg,${color}88,${color})`,
      borderRadius:height/2, transition:"width 1.1s cubic-bezier(.22,1,.36,1)" }}/>
    {p > 12 && <div style={{ position:"absolute", top:"50%", left:`${Math.min(p-2, 88)}%`, transform:"translate(-50%,-50%)",
      fontSize:10, fontWeight:800, color:"#fff" }}>{label ?? Math.round(p) + "%"}</div>}
  </div>;
}

function Ring({ pct, color, size = 96, thick = 7, T, center, sub, done }) {
  const r = (size - thick * 2) / 2, c = 2 * Math.PI * r;
  return <div style={{ position:"relative", width:size, height:size, margin:"0 auto" }}>
    <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={T.sub} strokeWidth={thick}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={done ? GREEN : color} strokeWidth={thick}
        strokeDasharray={c} strokeDashoffset={c - (Math.min(pct,100)/100)*c} strokeLinecap="round"
        style={{ transition:"stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)" }}/>
    </svg>
    <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
      <div style={{ fontSize: done ? 22 : 19, fontWeight:900, color: done ? GREEN : color, lineHeight:1 }}>{done ? "✓" : center}</div>
      {sub && <div style={{ fontSize:9, color:T.muted, marginTop:2 }}>{sub}</div>}
    </div>
  </div>;
}

function Modal({ children, onClose, T, width = 660 }) {
  useEffect(() => {
    const esc = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [onClose]);
  return <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(6,12,24,.6)", zIndex:9000,
    display:"flex", alignItems:"center", justifyContent:"center", padding:16, animation:"rise .22s" }}>
    <div onClick={e => e.stopPropagation()} style={{ background:T.card, color:T.text, borderRadius:20, padding:26,
      width:"100%", maxWidth:width, maxHeight:"88vh", overflow:"auto", boxShadow:"0 24px 70px rgba(0,0,0,.35)" }}>
      {children}
    </div>
  </div>;
}

function ModalHead({ title, onClose, T, sub }) {
  return <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
    <div>
      <div className="display" style={{ fontSize:23 }}>{title}</div>
      {sub && <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>{sub}</div>}
    </div>
    <button onClick={onClose} aria-label="Close" style={{ background:"none", border:"none", fontSize:26, cursor:"pointer", color:T.muted, lineHeight:1 }}>×</button>
  </div>;
}

   9. CHARTS
   ══════════════════════════════════════════════════════════════════════ */

function LineChart({ data, field, color, fmt, height = 170, T, id }) {
  const [hover, setHover] = useState(null);
  const W = 540, PL = 54, PR = 16, PT = 20, PB = 30;
  const vals = data.map(d => d[field]);
  const max = Math.max(...vals, 1);
  const x = i => PL + (i / Math.max(data.length - 1, 1)) * (W - PL - PR);
  const y = v => PT + (1 - v / max) * (height - PT - PB);
  const pts = data.map((d, i) => ({ x: x(i), y: y(d[field]) }));

  let path = "";
  if (pts.length > 1) {
    path = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const dx = (pts[i].x - pts[i-1].x) * .38;
      path += ` C${pts[i-1].x+dx},${pts[i-1].y} ${pts[i].x-dx},${pts[i].y} ${pts[i].x},${pts[i].y}`;
    }
  }
  const area = path ? `${path} L${pts[pts.length-1].x},${height-PB} L${pts[0].x},${height-PB} Z` : "";
  const gridLines = [0, 1, 2, 3, 4].map(i => Math.round(max / 4 * i));
  const labelEvery = Math.max(1, Math.ceil(data.length / 7));

  return <div style={{ position:"relative" }} onMouseLeave={() => setHover(null)}>
    <svg viewBox={`0 0 ${W} ${height + 6}`} style={{ width:"100%", height:height + 6, display:"block" }}>
      <defs>
        <linearGradient id={`g${id}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".26"/>
          <stop offset="92%" stopColor={color} stopOpacity=".01"/>
        </linearGradient>
      </defs>
      {gridLines.map((g, i) => <g key={i}>
        <line x1={PL} y1={y(g)} x2={W-PR} y2={y(g)} stroke={T.border} strokeWidth={i ? .7 : 1.2} strokeDasharray={i ? "4,4" : "none"} opacity=".7"/>
        <text x={PL-7} y={y(g)+4} textAnchor="end" fontSize="10" fill={T.muted}>{fmt ? fmt(g) : g}</text>
      </g>)}
      {area && <path d={area} fill={`url(#g${id})`}/>}
      {path && <path d={path} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>}
      <line x1={PL} y1={height-PB} x2={W-PR} y2={height-PB} stroke={T.border} strokeWidth="1.2"/>
      {pts.map((p, i) => {
        const on = hover === i;
        const left = i === 0 ? PL : (pts[i-1].x + p.x) / 2;
        const right = i === pts.length-1 ? W-PR : (p.x + pts[i+1].x) / 2;
        return <g key={i}>
          {on && <line x1={p.x} y1={PT} x2={p.x} y2={height-PB} stroke={color} strokeWidth="1.4" strokeDasharray="4,3" opacity=".6"/>}
          <rect x={left} y={PT} width={Math.max(right-left, 2)} height={height-PT-PB} fill="transparent"
            style={{ cursor:"crosshair" }} onMouseEnter={() => setHover(i)}/>
          {vals[i] > 0 && <circle cx={p.x} cy={p.y} r={on ? 6 : 3.4} fill={on ? color : T.card} stroke={color} strokeWidth={on ? 2.4 : 2}/>}
          {(i % labelEvery === 0 || i === pts.length-1) &&
            <text x={p.x} y={height-PB+15} textAnchor="middle" fontSize="10" fill={T.muted}>{data[i].label}</text>}
        </g>;
      })}
    </svg>
    {hover != null && <div style={{ position:"absolute", left:`${(pts[hover].x / W)*100}%`, top:`${(pts[hover].y/(height+6))*100}%`,
      transform:"translate(-50%,-135%)", background:T.card, border:`2px solid ${color}`, borderRadius:10,
      padding:"6px 12px", pointerEvents:"none", whiteSpace:"nowrap", boxShadow:"0 8px 22px rgba(0,0,0,.18)", zIndex:5 }}>
      <div style={{ fontSize:13, fontWeight:800, color }}>{fmt ? fmt(vals[hover]) : vals[hover]}</div>
      <div style={{ fontSize:10, color:T.muted }}>{data[hover].label}</div>
    </div>}
  </div>;
}

function Donut({ segments, centerVal, centerLabel, T, size = 170 }) {
  const r = 56, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = segments.reduce((a, s) => a + s.value, 0) || 1;
  let offset = 0;
  return <svg width={size} height={size} style={{ display:"block", margin:"0 auto" }}>
    <circle cx={cx} cy={cy} r={r} fill="none" stroke={T.sub} strokeWidth="22"/>
    {segments.map((s, i) => {
      const dash = (s.value / total) * circ;
      const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="22"
        strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-offset} transform={`rotate(-90 ${cx} ${cy})`}/>;
      offset += dash;
      return el;
    })}
    <text x={cx} y={cy-4} textAnchor="middle" fontSize="21" fontWeight="900" fill={T.text}>{centerVal}</text>
    <text x={cx} y={cy+15} textAnchor="middle" fontSize="11" fill={T.muted}>{centerLabel}</text>
  </svg>;
}

function HBars({ items, max, fmt, T }) {

   10. RACE TRACK — the signature view

function RaceTrack({ producers, field, icon, title, T, period, fmt }) {
  const sorted = [...producers].sort((a, b) => b[field] - a[field]);
  const max = Math.max(...producers.map(p => p[field]), 1);
  const over = period ? new Date() > new Date(period.end + "T23:59:59") : false;

  return <Card T={T} style={{ marginBottom:14 }}>
    <SectionTitle T={T} right={over && <span style={{ fontSize:10, background:"#fef3c7", color:"#b45309",
      padding:"3px 10px", borderRadius:6, fontWeight:800 }}>PERIOD CLOSED</span>}>{title}</SectionTitle>
    {sorted.map((p, i) => {
      const pct = pctOf(p[field], max), bar = Math.max(pct, 3), lead = i === 0 && p[field] > 0;
      return <div key={p.id} style={{ marginBottom:18 }}>
        <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:4 }}>
          <span style={{ fontWeight:800, color:p.color }}>{p.avatar} {firstName(p.name)}{lead ? " 👑" : ""}</span>
          <span style={{ fontWeight:800, color:T.text }}>{fmt ? fmt(p[field]) : p[field]}</span>
        </div>
        <div style={{ position:"relative", height:78, paddingRight:46 }}>
          <div style={{ position:"absolute", left:`calc(${bar}% - 20px)`, top:0, fontSize:38, lineHeight:1, zIndex:3,
            filter:"drop-shadow(0 4px 7px rgba(0,0,0,.25))", pointerEvents:"none",
            animation: `${field === "premium" ? "revv .6s" : "gallop .45s"} infinite` }}>
            <span style={{ display:"inline-block", transform:"scaleX(-1)" }}>{icon}</span>
          </div>
          <div style={{ position:"absolute", bottom:0, left:0, right:46, height:22, background:T.sub, borderRadius:"11px 0 0 11px", overflow:"hidden" }}>
            <div style={{ width:`${bar}%`, height:"100%", background:`linear-gradient(90deg,${p.color}55,${p.color})`,
              borderRadius:"11px 0 0 11px", transition:"width 1.4s cubic-bezier(.22,1,.36,1)" }}/>
          </div>
          <div style={{ position:"absolute", bottom:0, right:0, width:46, height:22, borderRadius:"0 11px 11px 0",
            border:`1px solid ${T.border}`,
            background:"repeating-linear-gradient(90deg,#111 0 6px,#fff 6px 12px)" }}/>
          <div style={{ position:"absolute", bottom:20, right:15, display:"flex", flexDirection:"column", alignItems:"center" }}>
            <div style={{ fontSize: over && lead ? 24 : 18, lineHeight:1, animation: over && lead ? "pulse 1s infinite" : "none" }}>
              {over && lead ? "🏆" : over ? "🎌" : "🏁"}
            </div>
            <div style={{ width:3, height:26, background:"#64748b", borderRadius:2 }}/>
          </div>
        </div>
      </div>;
    })}
  </Card>;
}

/* Starting a clean year: every producer gets a new sheet on the new dates, and
   last year's is renamed and kept. Deliberately a typed confirmation — it takes
   the current figures off the leaderboard the moment it runs. */
function NewYearModal({ T, periods, producers, onClose, onDone, addLog }) {
  const [label, setLabel] = useState(String(new Date().getFullYear()));
  const [typed, setTyped] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [done, setDone] = useState(null);

  const go = async () => {
    if (typed.trim().toUpperCase() !== "NEW YEAR") return setErr('Type NEW YEAR to confirm.');
    setBusy(true); setErr("");
    const r = await api("newFolioYear", { confirm:"YES", label: label.trim() });
    setBusy(false);
    if (r.ok) {
      setDone(r);
      addLog(`New folio year started. Rebuilt: ${(r.rebuilt||[]).join(", ") || "nobody"}`, "ok");
      if ((r.failed||[]).length) addLog("Problems: " + r.failed.join(" · "), "warn");
    } else setErr(r.error || "Could not start the new year.");
  };

  if (done) return <Modal onClose={() => onDone(done.producers || producers)} T={T} width={520}>
    <div style={{ textAlign:"center" }}>
      <div style={{ fontSize:42, marginBottom:10 }}>🗄️</div>
      <div className="display" style={{ fontSize:24, marginBottom:8 }}>New year started</div>
      <div style={{ fontSize:13, color:T.text2, lineHeight:1.7, marginBottom:16 }}>
        {(done.rebuilt || []).length} producer{(done.rebuilt||[]).length === 1 ? "" : "s"} moved to fresh sheets.
        Last year's are renamed <b>[{done.label}]</b> and still in Drive.
      </div>
      {!!(done.failed || []).length && <div style={{ padding:"11px 14px", borderRadius:11, background:"#fff7ed",
        border:"1px solid #fed7aa", fontSize:12, color:"#9a3412", textAlign:"left", marginBottom:14 }}>
        {done.failed.map((f, i) => <div key={i}>⚠️ {f}</div>)}
      </div>}
      <button onClick={() => onDone(done.producers || producers)} style={{ ...btn(T,"primary"), width:"100%", padding:12 }}>Done</button>
    </div>
  </Modal>;

  return <Modal onClose={onClose} T={T} width={520}>
    <ModalHead title="🗄️ Start a clean year" onClose={onClose} T={T}/>
    <div style={{ fontSize:13, color:T.text2, lineHeight:1.7, marginBottom:14 }}>
      Every producer gets a brand-new sheet built on the <b>{periods.length}</b> periods
      currently configured. Their existing sheet is renamed and kept in Drive — nothing
      is deleted, and the link stays on their record.
    </div>
    <div style={{ padding:"12px 15px", borderRadius:12, background:AMBER + "0d",
      border:`1px solid ${AMBER}44`, fontSize:12, color:"#92400e", lineHeight:1.7, marginBottom:14 }}>
      This year's figures come off the leaderboard straight away, because the dashboard
      reads whatever the roster points at. Make sure <b>Contest periods</b> holds the new
      dates before you run it.
    </div>

    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>ARCHIVE LABEL</div>
      <input value={label} onChange={e => setLabel(e.target.value)} style={{ ...input(T) }}/>
      <div style={{ fontSize:11, color:T.muted, marginTop:5 }}>
        Added to the old sheet names, e.g. "YDI Sales Log — Joey [{label || "2026"}]".
      </div>
    </div>

    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>TYPE "NEW YEAR" TO CONFIRM</div>
      <input value={typed} onChange={e => { setTyped(e.target.value); setErr(""); }}
        placeholder="NEW YEAR" style={{ ...input(T), fontWeight:700, letterSpacing:1 }}/>
    </div>

    {err && <div style={{ padding:"10px 13px", borderRadius:10, background:RED + "10",
      border:`1px solid ${RED}44`, fontSize:12, color:RED, fontWeight:700, marginBottom:12 }}>{err}</div>}

    {busy && <div style={{ padding:"12px 15px", borderRadius:11, background:GREEN + "0d",
      border:`1px solid ${GREEN}44`, fontSize:13, color:GREEN, fontWeight:700, marginBottom:12 }}>
      <span style={{ display:"inline-block", animation:"spin 1s linear infinite", marginRight:9 }}>⏳</span>
      Building new sheets — about 15 seconds per producer.
    </div>}

    <div style={{ display:"flex", gap:10 }}>
      <button onClick={onClose} disabled={busy} style={{ ...btn(T), flex:1, padding:13 }}>Cancel</button>
      <button onClick={go} disabled={busy} style={{ ...btn(T,"danger"), flex:2, padding:13, opacity: busy ? .6 : 1 }}>
        {busy ? "Working…" : "Start the new year"}
      </button>
    </div>
  </Modal>;
}

/* ── Manage producers ─────────────────────────────────────────────────── */

/* Add flow: name + email -> backend builds the sheet -> link with copy + email.
   The admin never opens a spreadsheet and never edits this file. */
function AddProducerFlow({ onDone, onCancel, T, existingCount }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [avatar, setAvatar] = useState("🧑‍💼");
  const [color, setColor] = useState(PALETTE[existingCount % PALETTE.length]);
  const [autoEmail, setAutoEmail] = useState(true);
  const [mode, setMode] = useState(null);          // "create" | "link"
  const [sheetUrl, setSheetUrl] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [done, setDone] = useState(null);
  const [copied, setCopied] = useState(false);

  const create = async () => {
    if (!name.trim()) return setErr("Enter the producer's name.");
    if (email.trim() && !email.includes("@")) return setErr("That email address doesn't look right.");
    setBusy(true); setErr("");
    const r = await api("createProducer", {
      name: name.trim(), email: email.trim(), avatar, color,
      sendEmail: autoEmail && email.trim() ? "true" : "false",
    });
    setBusy(false);
    if (r.ok) setDone(r);
    else setErr(r.error || "The sheet could not be created.");
  };

  const link = async () => {
    if (!name.trim()) return setErr("Enter the producer's name.");
    if (!sheetUrl.trim()) return setErr("Paste the link to their existing spreadsheet.");
    if (email.trim() && !email.includes("@")) return setErr("That email address doesn't look right.");
    setBusy(true); setErr("");
    const r = await api("linkProducer", {
      name: name.trim(), email: email.trim(), avatar, color, sheetUrl: sheetUrl.trim(),
    });
    setBusy(false);
    if (r.ok) setDone(r);
    else setErr(r.error || "That spreadsheet could not be linked.");
  };

  const copyLink = () => {
    const url = done.sheetUrl;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => setCopied(true), () => setCopied(false));
    else {
      const t = document.createElement("textarea");
      t.value = url; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); setCopied(true); } catch (e) {}
      document.body.removeChild(t);
    }
    setTimeout(() => setCopied(false), 2500);
  };

  const mailto = () => {
    const subject = encodeURIComponent("Your YDI sales log is ready");
    const body = encodeURIComponent(
      `Hi ${firstName(done.producer.name)},\n\n` +
      `Your sales log for the Battle Royale is set up. Log every bound policy here:\n\n${done.sheetUrl}\n\n` +
      `The current folio (${done.liveTab}) is the first tab, marked green. Fill in a row as soon as you bind — ` +
      `a row counts once it has a name and a premium above $0, so leave the premium blank on quotes.\n\n` +
      `Your numbers reach the leaderboard within about five minutes of saving.`);
    window.open(`mailto:${encodeURIComponent(done.producer.email || "")}?subject=${subject}&body=${body}`, "_blank");
  };

  /* Success panel */
  if (done) return <div style={{ animation:"rise .3s" }}>
    <div style={{ textAlign:"center", padding:"10px 0 18px" }}>
      <div style={{ fontSize:46, marginBottom:8 }}>🎉</div>
      <div className="display" style={{ fontSize:26 }}>{done.producer.name} is set up</div>
      <div style={{ fontSize:13, color:T.muted, marginTop:5 }}>
        {done.tabs.length} folio tabs · live folio <b style={{ color:GREEN }}>{done.liveTab}</b> is first
        {done.emailed ? " · welcome email sent" : ""}
      </div>
    </div>

    <div style={{ padding:"15px 17px", borderRadius:14, background:GREEN+"0d", border:`1px solid ${GREEN}44`, marginBottom:14 }}>
      <div style={{ fontSize:11, fontWeight:800, color:GREEN, letterSpacing:1, marginBottom:7 }}>THEIR SALES LOG</div>
      <div style={{ fontSize:12, color:T.text2, wordBreak:"break-all", background:T.card, padding:"10px 12px",
        borderRadius:9, border:`1px solid ${T.line}`, marginBottom:10, fontFamily:"ui-monospace,Menlo,monospace" }}>
        {done.sheetUrl}
      </div>
      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
        <button onClick={copyLink} style={{ ...btn(T, copied ? "go" : "primary"), flex:1, minWidth:130 }}>
          {copied ? "✓ Link copied" : "📋 Copy link"}
        </button>
        <a href={done.sheetUrl} target="_blank" rel="noreferrer" style={{ ...btn(T), flex:1, minWidth:130,
          textAlign:"center", textDecoration:"none", display:"inline-block" }}>Open sheet ↗</a>
        {done.producer.email && <button onClick={mailto} style={{ ...btn(T,"go"), flex:1, minWidth:130 }}>✉️ Email it to them</button>}
      </div>
    </div>

    {done.emailed && <div style={{ padding:"11px 14px", borderRadius:11, background:INDIGO+"0b",
      border:`1px solid ${INDIGO}33`, fontSize:12, color:T.text2, marginBottom:12 }}>
      A welcome email with the link and instructions already went to <b>{done.producer.email}</b>. Use
      “Email it to them” only if you want to send your own note as well.
    </div>}

    {!!(done.warnings || []).length && <div style={{ padding:"11px 14px", borderRadius:11, background:"#fff7ed",
      border:"1px solid #fed7aa", fontSize:12, color:"#9a3412", marginBottom:12 }}>
      {done.warnings.map((w, i) => <div key={i}>⚠️ {w}</div>)}
    </div>}

    <div style={{ padding:"11px 14px", borderRadius:11, background:T.sub, fontSize:12, color:T.text2, lineHeight:1.6, marginBottom:14 }}>
      They already have edit access. Nothing else needs setting up — their numbers appear on the
      leaderboard within about five minutes of their first saved row.
    </div>

    <button onClick={() => onDone(done.producers)} style={{ ...btn(T,"primary"), width:"100%", padding:13 }}>Done</button>
  </div>;

  /* Choose: build a new sheet, or adopt one that already exists */
  if (!mode) return <div>
    <div style={{ fontSize:13, color:T.text2, lineHeight:1.65, marginBottom:16 }}>
      Does this producer already have a sales log?
    </div>
    {[{ id:"create", icon:"📄", title:"No — build them a new one",
        body:"Creates the spreadsheet, adds a tab per folio, shares it, and emails them the link." },
      { id:"link", icon:"🔗", title:"Yes — connect their existing sheet",
        body:"Keeps everything already logged. Adds any missing folio tabs and brings the columns up to date." }
     ].map(o =>
      <button key={o.id} onClick={() => { setMode(o.id); setErr(""); }}
        style={{ display:"flex", gap:14, alignItems:"flex-start", width:"100%", textAlign:"left",
          padding:"16px 18px", borderRadius:14, marginBottom:10, cursor:"pointer",
          background:T.sub, border:`1px solid ${T.line}`, color:T.text }}>
        <span style={{ fontSize:26 }}>{o.icon}</span>
        <span>
          <span style={{ display:"block", fontSize:14, fontWeight:700, marginBottom:3 }}>{o.title}</span>
          <span style={{ display:"block", fontSize:12, color:T.muted, lineHeight:1.6 }}>{o.body}</span>
        </span>
      </button>)}
    <button onClick={onCancel} style={{ ...btn(T), width:"100%", padding:12, marginTop:4 }}>Cancel</button>
  </div>;

  /* Entry form */
  return <div>
    <button onClick={() => { setMode(null); setErr(""); }}
      style={{ ...btn(T), padding:"5px 11px", fontSize:11, marginBottom:12 }}>← Back</button>
    <div style={{ fontSize:13, color:T.text2, lineHeight:1.65, marginBottom:16 }}>
      {mode === "link"
        ? "Nothing is created or overwritten. Their existing policies stay exactly as they are."
        : "This builds their Google Sheet, sets up every folio tab, shares it with them, and hands you the link."}
    </div>

    {mode === "link" && <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>LINK TO THEIR SPREADSHEET</div>
      <input value={sheetUrl} onChange={e => { setSheetUrl(e.target.value); setErr(""); }}
        placeholder="Paste the Google Sheets link"
        style={{ ...input(T), fontSize:13 }}/>
      <div style={{ fontSize:11, color:T.muted, marginTop:5 }}>
        Open their sheet, copy the address bar, paste it here.
      </div>
    </div>}

    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>PRODUCER NAME</div>
      <input value={name} autoFocus onChange={e => { setName(e.target.value); setErr(""); }}
        onKeyDown={e => e.key === "Enter" && create()}
        placeholder="e.g. Marcus Webb" style={{ ...input(T), fontSize:15 }}/>
    </div>

    <div style={{ marginBottom:12 }}>
      <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>THEIR GOOGLE EMAIL</div>
      <input value={email} onChange={e => { setEmail(e.target.value); setErr(""); }}
        onKeyDown={e => e.key === "Enter" && create()}
        placeholder="name@youngdouglasinsurance.com" style={{ ...input(T), fontSize:15 }}/>
      <div style={{ fontSize:11, color:T.muted, marginTop:5 }}>
        {mode === "link"
          ? "Gives them edit access if they don't already have it. Safe to leave blank."
          : "Gives them edit access. Leave blank to create the sheet now and share it yourself later."}
      </div>
    </div>

    <div style={{ display:"flex", gap:12, alignItems:"center", marginBottom:12, flexWrap:"wrap" }}>
      <div>
        <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>AVATAR</div>
        <select value={avatar} onChange={e => setAvatar(e.target.value)}
          style={{ ...input(T), width:"auto", fontSize:20 }}>
          {AVATARS.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
      </div>
      <div>
        <div style={{ fontSize:11, fontWeight:800, color:T.muted, letterSpacing:1, marginBottom:5 }}>COLOR</div>
        <input type="color" value={color} onChange={e => setColor(e.target.value)}
          style={{ width:52, height:40, border:"none", borderRadius:9, cursor:"pointer", background:"none" }}/>
      </div>
      {mode === "create" && <div style={{ flex:1, minWidth:180, alignSelf:"flex-end" }}>
        <label style={{ display:"flex", gap:9, alignItems:"flex-start", padding:"11px 13px", borderRadius:11,
          background: email.trim() ? T.sub : "transparent", border:`1px solid ${T.line}`,
          cursor: email.trim() ? "pointer" : "default", opacity: email.trim() ? 1 : .45 }}>
          <input type="checkbox" checked={autoEmail && !!email.trim()} disabled={!email.trim()}
            onChange={e => setAutoEmail(e.target.checked)} style={{ marginTop:2 }}/>
          <span style={{ fontSize:12, color:T.text2 }}>
            <b style={{ color:T.text }}>Send them a welcome email</b><br/>Link plus how to log a policy.
          </span>
        </label>
      </div>}
    </div>

    {err && <div style={{ padding:"11px 14px", borderRadius:11, background:RED+"10", border:`1px solid ${RED}44`,
      fontSize:12, color:RED, fontWeight:700, marginBottom:12 }}>{err}</div>}

    {busy && <div style={{ padding:"12px 15px", borderRadius:11, background:GREEN+"0d", border:`1px solid ${GREEN}44`,
      fontSize:13, color:GREEN, fontWeight:700, marginBottom:12 }}>
      <span style={{ display:"inline-block", animation:"spin 1s linear infinite", marginRight:9 }}>⏳</span>
      {mode === "link" ? "Checking the sheet and bringing its tabs up to date…"
                       : "Building the spreadsheet and folio tabs… this takes about 15 seconds."}
    </div>}

    <div style={{ display:"flex", gap:10 }}>
      <button onClick={onCancel} disabled={busy} style={{ ...btn(T), flex:1, padding:13, opacity: busy ? .5 : 1 }}>Cancel</button>
      <button onClick={mode === "link" ? link : create} disabled={busy}
        style={{ ...btn(T,"go"), flex:2, padding:13, opacity: busy ? .6 : 1 }}>
        {busy ? (mode === "link" ? "Connecting…" : "Creating…")
              : (mode === "link" ? "Connect this sheet" : "Create their sales log")}
      </button>
    </div>
  </div>;
}

function ProducersModal({ producers, onSave, onClose, T }) {
  const [rows, setRows] = useState(producers.map(p => ({ ...p })));
  const [adding, setAdding] = useState(false);
  const [confirm, setConfirm] = useState(null);
  const [revoke, setRevoke] = useState(true);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const [editingLink, setEditingLink] = useState(null);
  const [linkDraft, setLinkDraft] = useState("");

  const set = (i, f, v) => setRows(r => r.map((x, j) => j === i ? { ...x, [f]: v } : x));

  const remove = async () => {
    const p = confirm.p;
    setBusy(true);
    const r = await api("removeProducer", { id:p.id, name:p.name, revoke: revoke ? "true" : "false" });
    setBusy(false);
    setConfirm(null);

    // Clear locally whatever the backend said. Leaving the row on screen after
    // the person confirmed a removal reads as a broken button, and the backend
    // treats a missing producer as already removed anyway.
    const next = (r.ok && Array.isArray(r.producers) && !r.alreadyGone)
      ? r.producers
      : rows.filter(x => x.id !== p.id);

    setRows(next.map(x => ({ ...x })));
    onSave(next, { silent:true });

    if (!r.ok) setNote(`${p.name} removed here, but the backend reported: ${r.error || "unknown error"}`);
    else if ((r.warnings || []).length) setNote(`${p.name} removed. ${r.warnings.join(" ")}`);
    else setNote(`${p.name} removed.`);
  };

  const save = async () => {
    setBusy(true);
    const r = await api("saveProducers", { producers: rows, allowEmpty: rows.length ? "false" : "true" });
    setBusy(false);
    if (r.ok) { onSave(r.producers); onClose(); }
    else setNote(r.error || "Could not save. Your changes are still here — try again.");
  };

  if (adding) return <Modal onClose={() => setAdding(false)} T={T} width={560}>
    <ModalHead title="➕ Add a producer" onClose={() => setAdding(false)} T={T}/>
    <AddProducerFlow T={T} existingCount={rows.length}
      onCancel={() => setAdding(false)}
      onDone={list => { setRows(list.map(x => ({ ...x }))); onSave(list, { silent:true }); setAdding(false); }}/>
  </Modal>;

  if (confirm) return <Modal onClose={() => setConfirm(null)} T={T} width={430}>
    <div style={{ textAlign:"center" }}>
      <div style={{ fontSize:40, marginBottom:10 }}>{confirm.p.avatar}</div>
      <div className="display" style={{ fontSize:22, marginBottom:6 }}>Remove {confirm.p.name}?</div>
      <p style={{ fontSize:13, color:T.text2, lineHeight:1.65, marginBottom:16 }}>
        They come off the dashboard, leaderboards, and goal rollups. Their spreadsheet stays in Drive — nothing is deleted.
      </p>
      {confirm.p.sheetId && <label style={{ display:"flex", gap:10, textAlign:"left", padding:"12px 14px", borderRadius:12,
        background:T.sub, border:`1px solid ${T.line}`, cursor:"pointer", marginBottom:16 }}>
        <input type="checkbox" checked={revoke} onChange={e => setRevoke(e.target.checked)} style={{ marginTop:3 }}/>
        <span style={{ fontSize:12, color:T.text2 }}>
          <b style={{ color:T.text }}>Revoke link sharing too</b><br/>The sheet stops being readable if they're ever re-added by mistake. They keep edit access.
        </span>
      </label>}
      <div style={{ display:"flex", gap:10 }}>
        <button onClick={() => setConfirm(null)} style={{ ...btn(T), flex:1, padding:12 }}>Keep them</button>
        <button onClick={remove} disabled={busy} style={{ ...btn(T,"danger"), flex:1, padding:12, opacity: busy ? .6 : 1 }}>
          {busy ? "Removing…" : "Remove producer"}
        </button>
      </div>
    </div>
  </Modal>;

  return <Modal onClose={onClose} T={T} width={720}>
    <ModalHead title="👥 Manage producers" onClose={onClose} T={T}
      sub="Adding someone builds their sales log, shares it, and gives you the link to send."/>

    {!hasBackend() && <div style={{ padding:"12px 15px", borderRadius:12, background:"#fff7ed",
      border:"1px solid #fed7aa", fontSize:12, color:"#9a3412", marginBottom:14, lineHeight:1.6 }}>
      <b>No backend connected.</b> Deploy the Apps Script and paste its /exec URL into CONFIG.backendUrl.
      Until then producers can only be linked by hand.
    </div>}

    <button onClick={() => setAdding(true)} disabled={!hasBackend()}
      style={{ ...btn(T,"go"), width:"100%", padding:14, marginBottom:16, fontSize:14, opacity: hasBackend() ? 1 : .45 }}>
      ➕ Add a producer
    </button>

    {note && <div style={{ padding:"10px 13px", borderRadius:10, background:T.sub, fontSize:12,
      color:T.text2, marginBottom:12, fontWeight:600 }}>{note}</div>}

    {!rows.length && <div style={{ textAlign:"center", padding:"26px 0", color:T.muted }}>
      <div style={{ fontSize:36, marginBottom:8 }}>👥</div>
      <div style={{ fontSize:13, fontWeight:600 }}>No producers yet.</div>
    </div>}

    {rows.map((p, i) => <div key={p.id} style={{ padding:14, borderRadius:14, marginBottom:10,
      background:T.sub, border:`1px solid ${T.line}` }}>
      <div style={{ display:"flex", gap:8, marginBottom:9, alignItems:"center" }}>
        <input value={p.name} onChange={e => set(i,"name",e.target.value)}
          style={{ ...input(T), background:T.card, fontWeight:600 }}/>
        <select value={p.avatar} onChange={e => set(i,"avatar",e.target.value)}
          style={{ ...input(T), width:"auto", fontSize:18, background:T.card }}>
          {AVATARS.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
        <input type="color" value={p.color} onChange={e => set(i,"color",e.target.value)} title="Producer color"
          style={{ width:38, height:38, border:"none", borderRadius:9, cursor:"pointer", background:"none" }}/>
        <button onClick={() => setConfirm({ p })} title="Remove producer"
          style={{ ...btn(T,"danger"), padding:"9px 11px" }}>🗑</button>
      </div>

      {p.sheetId && <div style={{ padding:"9px 13px", borderRadius:11,
        background:GREEN+"12", border:`1px solid ${GREEN}44`, marginBottom:9 }}>
        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
          <span style={{ fontSize:12, color:GREEN, fontWeight:800 }}>✓ Sheet linked</span>
          {p.email && <span style={{ fontSize:11, color:T.muted }}>{p.email}</span>}
          {p.sheetUrl && <a href={p.sheetUrl} target="_blank" rel="noreferrer"
            style={{ fontSize:11, color:GREEN, fontWeight:700 }}>Open sheet ↗</a>}
          <a href={csvByGid(p.sheetId, p.gid || 0)} target="_blank" rel="noreferrer"
            style={{ fontSize:11, color:INDIGO, fontWeight:700 }}>Test CSV feed ↗</a>
          {p.sheetUrl && <button onClick={() => { if (navigator.clipboard) navigator.clipboard.writeText(p.sheetUrl); setNote("Link copied for " + firstName(p.name) + "."); }}
            style={{ ...btn(T), padding:"4px 11px", fontSize:11, marginLeft:"auto" }}>Copy link</button>}
          <button onClick={() => { setEditingLink(editingLink === p.id ? null : p.id); setLinkDraft(""); setNote(""); }}
            style={{ ...btn(T), padding:"4px 11px", fontSize:11 }}>
            {editingLink === p.id ? "Cancel" : "Change link"}
          </button>
        </div>

        {editingLink === p.id && <div style={{ marginTop:10, paddingTop:10, borderTop:`1px solid ${GREEN}33` }}>
          <div style={{ fontSize:11, color:T.text2, lineHeight:1.6, marginBottom:7 }}>
            Paste a different spreadsheet to point {firstName(p.name)} at. It is checked,
            brought up to the current layout, and wired in before anything changes — so a bad
            link fails without disturbing what they already have.
          </div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            <input value={linkDraft} onChange={e => { setLinkDraft(e.target.value); setNote(""); }}
              placeholder="Paste the Google Sheets link"
              style={{ ...input(T), background:T.card, flex:1, minWidth:220, fontSize:12 }}/>
            <button disabled={busy} onClick={async () => {
              if (!linkDraft.trim()) return setNote("Paste a link first.");
              setBusy(true);
              const r = await api("updateSheet", { id:p.id, sheetUrl:linkDraft.trim() });
              setBusy(false);
              if (r.ok) {
                setRows((r.producers || rows).map(x => ({ ...x })));
                onSave(r.producers || rows, { silent:true });
                setEditingLink(null); setLinkDraft("");
                setNote(r.unchanged
                  ? `${p.name} was already on that sheet — re-checked and brought up to date.`
                  : `${p.name} now points at the new sheet — ${r.existingPolicies} policies found.`);
              } else setNote(r.error || "Could not update that link.");
            }} style={{ ...btn(T,"go"), padding:"8px 16px", fontSize:12, opacity: busy ? .6 : 1 }}>
              {busy ? "Checking…" : "Save link"}
            </button>
          </div>
        </div>}
      </div>}

      <div style={{ padding:"11px 13px", background:T.card, borderRadius:11, border:`1px solid ${T.line}` }}>
        <div style={{ fontSize:10, fontWeight:800, color:T.muted, marginBottom:8, letterSpacing:1 }}>PERIOD GOALS</div>
        <div className="grid5">
          {[["premium","Premium $"],["policies","Policies"],["personalLines","Pers. Lines"],["life","Life"],["commercial","Commercial"]].map(([f,label]) =>
            <div key={f}>
              <div style={{ fontSize:9, color:T.muted, marginBottom:3 }}>{label}</div>
              <input type="number" value={(p.goals || {})[f] ?? ""}
                onChange={e => set(i,"goals",{ ...(p.goals||{}), [f]:Number(e.target.value) })}
                style={{ ...input(T), padding:"6px 8px", fontSize:11 }}/>
            </div>)}
        </div>
      </div>
    </div>)}

    <div style={{ display:"flex", gap:10, marginTop:6 }}>
      <button onClick={onClose} style={{ ...btn(T), flex:1, padding:12 }}>Close</button>
      <button onClick={save} disabled={busy} style={{ ...btn(T,"primary"), flex:1, padding:12, opacity: busy ? .6 : 1 }}>
        {busy ? "Saving…" : "Save changes"}
      </button>
    </div>
  </Modal>;
}
